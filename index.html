<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bilgi Adaları</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e7fb8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--sea1:#0e7fb8;--sea2:#0a4f8a;--sand:#f6d98b;--grass:#4cbf5a;--ink:#16324f;--card:#fffdf6;--gold:#ffb703}
html,body{min-height:100%}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#3fb4e6 0%,var(--sea1) 35%,var(--sea2) 100%);background-attachment:fixed;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow-x:hidden;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;z-index:-1;
background-image:radial-gradient(ellipse 18px 4px at 20px 20px,#fff 50%,transparent 52%),radial-gradient(ellipse 14px 3px at 70px 60px,#fff 50%,transparent 52%);background-size:110px 90px;animation:waves 8s linear infinite}
@keyframes waves{to{background-position:110px 0,-110px 0}}
body.boss{background:linear-gradient(180deg,#3b2d5c 0%,#1d1a3a 60%,#0d0b1f 100%);background-attachment:fixed}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px 40px;position:relative}
button{font-family:inherit;cursor:pointer;border:none}
.title{text-align:center;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.title h1{font-size:42px;line-height:1;font-weight:800}
.title p{font-size:17px;opacity:.95;margin-top:6px}
.players{display:grid;gap:14px;margin-top:24px}
.pcard{background:var(--card);border-radius:22px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 0 rgba(0,0,0,.15);text-align:left;transition:transform .12s}
.pcard:active,.press:active{transform:translateY(3px)}
.pcard .av{font-size:44px;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.pcard h2{font-size:25px;line-height:1.1}
.pcard small{font-size:15px;opacity:.7;display:block}
.pcard .pr{font-size:14px;margin-top:3px;color:#b07a00;font-weight:700}
.topbar{display:flex;align-items:center;gap:6px;color:#fff;position:sticky;top:0;z-index:5;padding:6px 0;flex-wrap:wrap}
.chip{background:rgba(0,40,80,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:5px 11px;border-radius:999px;font-weight:800;font-size:15px;color:#fff;white-space:nowrap}
.back,.tb{background:rgba(0,40,80,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-weight:800;font-size:15px;padding:5px 12px;border-radius:999px}
.tb{font-size:19px;padding:3px 10px;position:relative}
.tb .dot{position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:#ff4d4d;border:2px solid #fff}
.sp{flex:1}
.daily{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#ffd166,#ffb703);border-radius:18px;padding:10px 14px;margin:8px 0 4px;font-weight:800;font-size:17px;box-shadow:0 5px 0 #c98a00;width:100%;text-align:left;color:#3a2600}
.daily span{font-size:34px;animation:wiggle 1.2s ease-in-out infinite}
@keyframes wiggle{25%{rotate:-10deg}75%{rotate:10deg}}
.map{position:relative;margin-top:6px}
.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.island{position:absolute;width:136px;transform:translate(-50%,-50%);text-align:center;background:none;color:var(--ink)}
.island .blob{width:108px;height:84px;margin:0 auto;border-radius:50% 50% 46% 54%/58% 52% 48% 42%;background:var(--sand);position:relative;box-shadow:0 0 0 7px rgba(255,255,255,.25),0 8px 0 rgba(0,0,0,.12);display:grid;place-items:center;transition:transform .15s}
.island .blob::before{content:"";position:absolute;inset:10px 14px 18px 12px;border-radius:50% 46% 52% 48%/55% 50% 50% 45%;background:var(--c,var(--grass))}
.island .em{position:relative;font-size:38px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.island .gd{position:absolute;left:-8px;bottom:-6px;font-size:24px}
.island .nm{display:inline-block;margin-top:7px;background:var(--card);padding:1px 9px;border-radius:12px;font-weight:800;font-size:14px;line-height:1.35;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.island .st{font-size:15px;letter-spacing:1px;color:#ffd84a;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.island.locked .blob{filter:grayscale(.9) brightness(.85)}
.island.locked .em,.island.locked .gd{opacity:.3}
.island .lock{position:absolute;right:2px;top:-6px;font-size:22px}
.island:not(.locked):active .blob{transform:scale(.94)}
.island.current .blob{animation:bob 1.8s ease-in-out infinite;box-shadow:0 0 0 7px rgba(255,216,74,.7),0 0 26px 8px rgba(255,216,74,.55),0 8px 0 rgba(0,0,0,.12)}
.island.bossi .blob{background:#6b5b4b}
.island.bossi .blob::before{background:#3d3a4f}
@keyframes bob{50%{transform:translateY(-6px)}}
.ship{position:absolute;font-size:36px;transform:translate(-50%,-50%);pointer-events:none;animation:rock 2s ease-in-out infinite;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
@keyframes rock{50%{rotate:8deg}}
.bottle{position:absolute;transform:translate(-50%,-50%);font-size:28px;background:none;animation:float 2.4s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(255,255,255,.8))}
@keyframes float{50%{transform:translate(-50%,-65%) rotate(12deg)}}
.panel{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.15)}
/* Savaş */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:#fff;gap:8px}
.qhead .isl{font-weight:800;font-size:17px;text-align:center;flex:1}
.hearts{font-size:19px;letter-spacing:1px;white-space:nowrap}
.arena{position:relative;height:178px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 16px 8px;margin-bottom:6px}
.fighter{font-size:62px;line-height:1;position:relative;transition:transform .2s}
.me{width:112px;height:170px;position:relative}
.me .hero{width:112px;height:170px}
.me .hero svg,.hcard svg{width:100%;height:100%;display:block}
.flip svg{transform:scaleX(-1)}
.pet{position:absolute;width:46px;height:44px;left:-6px;bottom:-4px;animation:petbob 1.4s ease-in-out infinite}
.pet svg{width:100%;height:100%}
@keyframes petbob{50%{transform:translateY(-6px)}}
.pet.joy{animation:joy .7s}
@keyframes joy{30%{transform:translateY(-26px) rotate(-20deg)}60%{transform:translateY(-10px) rotate(15deg)}}
.shot svg{width:42px;height:24px;display:block}
.hcard{height:150px;margin:0 auto 4px;width:100%}
.endless{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#3a0ca3,#7209b7);color:#fff;border-radius:18px;padding:10px 14px;margin:8px 0 4px;font-weight:800;font-size:17px;box-shadow:0 5px 0 #240046;width:100%;text-align:left}
.endless span{font-size:34px}
.endless small{font-weight:700;opacity:.85}
.wave{position:absolute;left:12px;top:6px;background:rgba(0,0,0,.4);color:#fff;font-weight:800;font-size:14px;padding:2px 10px;border-radius:99px}
.foe{text-align:center}
.foe .fe{font-size:70px;display:block;animation:idle 1.6s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-5px) scale(1.04)}}
.hp{width:118px;height:14px;background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden;border:2px solid rgba(255,255,255,.7);margin:0 auto 4px}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff5e5e,#ff9a3c);transition:width .4s}
.foe .fn{color:#fff;font-weight:800;font-size:13px;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.hitme{animation:hit .45s}
@keyframes hit{20%{transform:translateX(10px) rotate(8deg);filter:brightness(2) saturate(0)}50%{transform:translateX(-8px)}100%{transform:none}}
.ouch{animation:ouch .45s}
@keyframes ouch{20%{transform:translateX(-10px) rotate(-6deg);filter:brightness(1.6) sepia(1) hue-rotate(-50deg)}60%{transform:translateX(8px)}}
.boom{position:absolute;font-size:44px;pointer-events:none;animation:boom .55s ease-out forwards}
@keyframes boom{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.shot{position:absolute;pointer-events:none;left:100px;bottom:120px;animation:shot .38s ease-in forwards;z-index:3}
@keyframes shot{to{left:calc(100% - 110px);bottom:70px;transform:rotate(540deg)}}
.dmg{position:absolute;right:30px;top:0;font-weight:800;font-size:28px;color:#fff;text-shadow:0 2px 0 #c0392b,0 0 10px #ff6b6b;pointer-events:none;animation:up 1s ease-out forwards;white-space:nowrap}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
.combo{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-weight:800;font-size:20px;color:#fff;background:linear-gradient(90deg,#ff512f,#f09819);padding:2px 12px;border-radius:99px;box-shadow:0 3px 0 rgba(0,0,0,.2);animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.1)}}
.timer{height:10px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden;margin-bottom:10px}
.timer i{display:block;height:100%;width:100%;background:#7CFC9A;border-radius:99px}
.timer i.warn{background:#ffcf4a}.timer i.dang{background:#ff5e5e}
.q{font-size:21px;font-weight:700;line-height:1.3;margin-bottom:14px}
.qmeta{display:flex;justify-content:space-between;font-size:14px;opacity:.65;font-weight:800;margin-bottom:2px}
.opts{display:grid;gap:9px}
.opt{background:#eef6ff;border:3px solid #cfe3f7;border-radius:16px;padding:11px 14px;font-size:19px;font-weight:700;color:var(--ink);text-align:left;transition:transform .1s,opacity .3s}
.opt:active{transform:scale(.98)}
.opt.ok{background:#d9f7dc;border-color:#3cb04a}
.opt.no{background:#ffe0dd;border-color:#e2493b;animation:shake .35s}
.opt.gone{opacity:.15;pointer-events:none}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pows{display:flex;gap:8px;margin-top:12px}
.pow{flex:1;background:#fff4d6;border:2px solid #ffd27a;border-radius:14px;padding:6px 4px;font-weight:800;font-size:15px;color:#7a5200}
.pow:disabled{opacity:.35}
.pow b{font-size:12px;display:block;opacity:.8}
.exp{margin-top:12px;border-radius:16px;padding:11px 14px;font-size:17px;line-height:1.35}
.exp.good{background:#e7f9e9}.exp.bad{background:#fff1e6}
.exp b{display:block;font-size:19px;margin-bottom:2px}
.big{display:block;width:100%;margin-top:12px;background:var(--gold);color:#3a2600;font-weight:800;font-size:21px;padding:12px;border-radius:18px;box-shadow:0 5px 0 #c98a00}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #c98a00}
.big.alt{background:#e8eef5;color:var(--ink);box-shadow:0 5px 0 #b9c6d3}
.arena{position:relative;height:230px;margin-bottom:8px;border-radius:20px;overflow:hidden;background:rgba(255,255,255,.08);transition:height .35s;touch-action:none;-webkit-user-select:none}
.arena.act{height:64vh;background:rgba(0,0,0,.12)}
.hero2{position:absolute;bottom:6px;left:22%;width:88px;height:134px;transform:translateX(-50%);z-index:2}
.hero2 .hero{width:100%;height:100%}
.hero2 .pet{left:-30px}
.foe2{position:absolute;left:74%;top:120px;transform:translate(-50%,-50%);font-size:70px;line-height:1;z-index:2}
.foe2 .fe{display:block;animation:idle 1.6s ease-in-out infinite}
.foe2.hitme .fe{animation:hit .45s}
.ghp{position:absolute;right:10px;top:8px;text-align:center;z-index:3}
.ptimer{position:absolute;left:12px;right:150px;top:16px;height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;opacity:0;z-index:3}
.arena.act .ptimer{opacity:1}.ptimer i{display:block;height:100%;width:100%;background:#ffd84a}
.banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:34px;font-weight:800;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35);pointer-events:none;white-space:nowrap;opacity:0;z-index:4}
.banner.show{animation:ban 1.1s forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0}}
.phase-hint{position:absolute;left:0;right:0;top:32px;text-align:center;color:#fff;font-weight:800;font-size:16px;text-shadow:0 1px 0 rgba(0,0,0,.5);pointer-events:none;opacity:0;z-index:4}
.arena.act .phase-hint{opacity:1}
.arena .combo{top:auto;bottom:150px}
.arena.act .combo{display:none}
.proj{position:absolute;width:42px;height:24px;transform:translate(-50%,-50%);pointer-events:none;z-index:3}
.proj svg{width:100%;height:100%;display:block}
.eproj{position:absolute;font-size:30px;transform:translate(-50%,-50%);pointer-events:none;z-index:3}
.arena .dmg{right:auto}.arena .boom{z-index:4}
.php{display:flex;align-items:center;gap:4px;white-space:nowrap}.php b{width:78px;height:12px;background:rgba(0,0,0,.3);border-radius:99px;overflow:hidden;display:block;border:2px solid rgba(255,255,255,.6)}
.php b i{display:block;height:100%;background:#ff4d6d;transition:width .3s}.php em{font-style:normal;font-weight:800;font-size:14px;min-width:24px}
.hide{display:none!important}
.big.def{background:#4cc9f0;box-shadow:0 5px 0 #2a8fb0;color:#06324a}
.flash{position:fixed;inset:0;background:rgba(255,40,40,.35);pointer-events:none;animation:fl .4s forwards;z-index:7}
@keyframes fl{to{opacity:0}}
/* Sonuç */
.res{text-align:center}
.res .e{font-size:66px;line-height:1.1}
.res h2{font-size:28px;margin-top:4px;line-height:1.15}
.res .stars{font-size:44px;letter-spacing:6px;margin:6px 0;color:#ffc300}
.res p{font-size:18px}
.dim{opacity:.22}
.chest{font-size:84px;background:none;display:block;margin:6px auto;animation:wiggle 1s ease-in-out infinite}
.loot{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0}
.loot div{background:#fff4d6;border-radius:14px;padding:6px 12px;font-weight:800;font-size:17px;animation:popin .4s backwards}
@keyframes popin{from{transform:scale(0)}}
.conf{position:fixed;top:-30px;font-size:24px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
.reset{display:block;margin:22px auto 0;background:none;color:rgba(255,255,255,.75);font-size:14px;text-decoration:underline}
.modal{position:fixed;inset:0;background:rgba(0,30,60,.6);display:grid;place-items:center;padding:20px;z-index:8;animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.modal .panel{max-width:380px;width:100%;text-align:center;animation:popin .25s}
.legend{margin-top:16px;color:#fff;text-align:center;font-size:15px;opacity:.9;line-height:1.4}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#16324f;color:#fff;padding:10px 16px;border-radius:16px;font-weight:800;font-size:16px;z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;animation:toast 3s forwards;max-width:92vw}
.toast span{font-size:30px}
@keyframes toast{0%{transform:translate(-50%,120px)}10%,85%{transform:translate(-50%,0)}100%{transform:translate(-50%,120px)}}
/* Mağaza & Çanta */
h3.sec{color:#fff;font-size:21px;margin:16px 0 8px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{background:var(--card);border-radius:18px;padding:10px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.item .ie{font-size:40px;line-height:1.2}
.item h4{font-size:16px;line-height:1.15}
.item small{display:block;font-size:13px;opacity:.7;line-height:1.2;min-height:30px}
.buy{margin-top:6px;width:100%;background:var(--gold);color:#3a2600;font-weight:800;font-size:16px;padding:6px;border-radius:12px;box-shadow:0 3px 0 #c98a00}
.buy:disabled{background:#d8dee6;box-shadow:0 3px 0 #b9c6d3;color:#6b7c8f}
.buy.on{background:#3cb04a;color:#fff;box-shadow:0 3px 0 #2a8436}
.col{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.col div{background:var(--card);border-radius:14px;aspect-ratio:1;display:grid;place-items:center;font-size:32px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.col div.no{filter:grayscale(1) brightness(.4);opacity:.45}
.badge{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:8px 12px;margin-bottom:8px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.badge span{font-size:32px}
.badge b{display:block;font-size:16px;line-height:1.1}
.badge small{font-size:13px;opacity:.7}
.badge.no{opacity:.5}.badge.no span{filter:grayscale(1)}
</style>
</head>

 stopTimer();document.body.classList.remove('boss');
 const un=unlockedCount(player),allDone=un>ISLANDS.length;
 const nodes=[...ISLANDS.map((s,i)=>({...s,i})),{id:'treasure',name:'Hazine Adası',emoji:allDone?'💰':'❓',c:'#e0a526',i:ISLANDS.length}];
 const xs=[], STEP=148, TOP=70;nodes.forEach((n,i)=>xs.push(i===nodes.length-1?50:(i%2?72:28)));
 const H=TOP+STEP*(nodes.length-1)+110;
 const dailyReady=S().daily!==today();
 app.innerHTML=`${topbar('home()','← Kaptanlar')}
 ${dailyReady?`<button class="daily press" onclick="openDaily()"><span>🎁</span><div>Günlük hazine sandığın hazır!<br><small style="font-weight:700">Aç ve altınları kap</small></div></button>`:''}
 <button class="endless press" onclick="endlessIntro()"><span>♾️</span><div>Sonsuz Okyanus<br><small>Bitmeyen dalgalar · Rekorun: ${S().ew?`${S().ew}. dalga, ${S().eb} puan`:'henüz yok'}</small></div></button>
 <div class="map" id="map" style="height:${H}px"><svg id="path"></svg>
 ${nodes.map(n=>{const tre=n.id==='treasure';const locked=tre?!allDone:n.i>=un;const cur=!tre&&n.i===un-1;
  const st=S().stars[n.id]||0;
  return `<button class="island ${locked?'locked':''} ${cur||(tre&&allDone)?'current':''} ${n.boss?'bossi':''}" id="isl-${n.i}" style="left:${xs[n.i]}%;top:${TOP+n.i*STEP}px;--c:${n.c}" onclick="${locked?`lockedMsg(${tre})`:(tre?'treasure()':`intro('${n.id}')`)}">
   <div class="blob"><span class="em">${n.emoji}</span>${!tre?`<span class="gd">${st>0?'🏳️':n.g}</span>`:''}${locked?'<span class="lock">🔒</span>':''}</div>
   <div class="nm">${n.name}</div>${!tre?`<div class="st">${stars(st)}</div>`:''}</button>`;}).join('')}
 ${FACTS.map((f,i)=>{if(S().bottles[i]||i>=un)return '';const x=(xs[i]+xs[i+1])/2,y=TOP+i*STEP+STEP/2;return `<button class="bottle" style="left:${x}%;top:${y}px" onclick="bottle(${i})">🍾</button>`;}).join('')}
 <div class="ship" id="ship">${ship().e}</div></div>`;
 const m=document.getElementById('map'),w=m.clientWidth;
 const pts=nodes.map((n,i)=>[xs[i]/100*w,TOP+i*STEP]);
 let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=1;i<pts.length;i++){const[x0,y0]=pts[i-1],[x1,y1]=pts[i];d+=` C${x0},${(y0+y1)/2} ${x1},${(y0+y1)/2} ${x1},${y1}`;}
 document.getElementById('path').innerHTML=`<path d="${d}" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>`;
 const ci=Math.min(un-1,ISLANDS.length),sh=document.getElementById('ship');
 sh.style.left=(pts[ci][0]+(xs[ci]>50?-80:80))+'px';sh.style.top=(pts[ci][1]-10)+'px';
 if(scroll!==false){const el=document.getElementById('isl-'+ci);if(el)setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),80);}
}
function lockedMsg(tre){modal(`<div style="font-size:54px">${tre?'🗝️':'🔒'}</div><h2 style="margin:6px 0">${tre?'Hazine kilitli!':'Bu ada henüz kilitli'}</h2><p style="font-size:18px">${tre?'Hazineye ulaşmak için Kara Korsan dahil bütün adaları fethetmelisin!':'Önce bir önceki adanın bekçisini yen, sonra buraya yelken açabilirsin!'}</p><button class="big" onclick="closeModal()">Tamam</button>`);}
function bottle(i){S().bottles[i]=1;addCoins(15);if(Object.keys(S().bottles).length>=6)badge('bottle');persist();sCoin();
 modal(`<div style="font-size:30px">🍾 Şişede bir mesaj var!</div><div style="font-size:64px;margin:6px 0">${FACTS[i][0]}</div><p style="font-size:19px;font-weight:700;line-height:1.35">${FACTS[i][1]}</p><p style="margin-top:8px;font-weight:800;color:#b07a00">+15 🪙</p><button class="big" onclick="closeModal();map(false)">Süper!</button>`);}
function openDaily(){const n=40+Math.floor(Math.random()*5)*10;S().daily=today();addCoins(n);const gift=Math.random()<.5?POWERS[Math.floor(Math.random()*3)]:null;if(gift)S().pw[gift.id]++;persist();sWin();confetti(['🪙','🎁','✨']);
 modal(`<div style="font-size:70px">🎁</div><h2>Günlük Hazine!</h2><div class="loot"><div>+${n} 🪙</div>${gift?`<div style="animation-delay:.2s">+1 ${gift.e} ${gift.n}</div>`:''}</div><p style="font-size:16px;opacity:.75">Yarın yeni sandık seni bekliyor!</p><button class="big" onclick="closeModal();map(false)">Harika!</button>`);}

// ---------- Savaş ----------
const GSHOT={'🦀':'🫧','🐢':'🍃','🐙':'💧','🦜':'🪶','🐊':'🦴','🦉':'📚','🦈':'🌊','🦍':'🍌','🐉':'🔥','🐻':'🍯','🦂':'⚡','🐺':'❄️','🏴‍☠️':'💣'};
function intro(id){
 const isl=ISLANDS.find(x=>x.id===id);
 modal(`<div style="font-size:74px;line-height:1.1">${isl.g}</div><h2 style="line-height:1.1">${isl.gn}</h2><p style="font-size:17px;margin:4px 0 2px;opacity:.8">${isl.name} · ${subj(isl.s)}</p>
 <p style="font-size:17px;margin-top:8px;text-align:left">✅ <b>Doğru cevap = SALDIRI!</b> Kaçan bekçiye dokun, ${hero().shotName} fırlat!<br>❌ <b>Yanlış cevap = SAVUNMA!</b> Parmağını kaydır, atışlardan kaç!</p>
 <p style="font-size:15px;margin-top:6px;opacity:.75">🔥 3'lü seri = kritik saldırı, daha güçlü vuruş!</p>
 <button class="big" onclick="closeModal();start('${id}')">⚔️ Savaşa başla!</button><button class="big alt" onclick="closeModal()">Sonra</button>`);
}
function mkPool(isl){let pool;if(isl.boss){pool=[];for(const k in BANK[player])if(/\d$/.test(k))pool.push(...BANK[player][k]);}else pool=BANK[player][isl.id];
 return shuffle(pool).map(q=>({q:q[0],a:q[1],opts:shuffle([q[1],q[2],q[3],q[4]]),exp:q[5]}));}
function start(id){
 const isl=ISLANDS.find(x=>x.id===id),L=ISLANDS.indexOf(isl),gmax=isl.boss?220:100+L*10;
 run={isl,qs:mkPool(isl),i:0,php:100,gmax,ghp:gmax,lvl:L,correct:0,streak:0,coins:0,hits:0};
 document.body.classList.toggle('boss',!!isl.boss);question();
}
function phpHtml(){return `<span class="php"><span>❤️</span><b><i id="phpbar" style="width:${run.php}%"></i></b><em id="phpn">${Math.max(0,Math.round(run.php))}</em></span>`;}
function hud(){const h=hero();return `<div class="qhead"><button class="back" onclick="quit()">✕</button><span class="isl">${run.endless?`♾️ ${run.score} puan`:`${run.isl.emoji} ${subj(run.isl.s)}`}</span>${phpHtml()}</div>
 <div class="arena" id="arena">${run.endless?`<div class="wave">🌊 Dalga ${run.wave}</div>`:''}
 <div class="ghp"><div class="hp"><i id="hpbar" style="width:${run.ghp/run.gmax*100}%"></i></div><div class="fn" id="fn">${run.isl.gn}</div></div>
 <div class="foe2" id="foe"><span class="fe">${run.isl.g}</span></div>
 <div class="hero2" id="me"><div class="hero ${h.flip?'flip':''}">${h.svg}</div>${player==='emir'?`<div class="pet" id="pet">${CAT_SVG}</div>`:''}</div>
 ${run.streak>=3?`<div class="combo">🔥 x${run.streak} KRİTİK!</div>`:run.streak>=2?`<div class="combo" style="background:linear-gradient(90deg,#f7971e,#ffd200)">🔥 x${run.streak}</div>`:''}
 <div class="ptimer"><i id="ptbar"></i></div><div class="banner" id="banner"></div><div class="phase-hint" id="phint"></div></div>`;}
function question(){
 stopTimer();
 if(run.endless){while(run.qs.length<=run.i)run.qs.push(endlessQ());}
 else if(run.i>=run.qs.length){run.qs=run.qs.concat(mkPool(run.isl));}
 const q=run.qs[run.i];run.answered=false;const pw=S().pw;
 app.innerHTML=`${hud()}<div class="timer" id="qtimer"><i id="tbar"></i></div>
 <div class="panel" id="qpanel"><div class="qmeta"><span>${run.endless?(q.sub||'Karışık'):'Soru '+(run.i+1)}</span><span id="tleft"></span></div>
 <div class="q">${q.q}</div><div class="opts">${q.opts.map((o,k)=>`<button class="opt" id="o${k}" onclick="answer(${k})">${o}</button>`).join('')}</div>
 <div class="pows" id="pows">${POWERS.map(p=>`<button class="pow" id="pw-${p.id}" onclick="usePow('${p.id}')" ${pw[p.id]<1||(p.id==='heart'&&run.php>=100)?'disabled':''}>${p.e} ${p.n}<b>x${pw[p.id]}</b></button>`).join('')}</div>
 <div id="fb"></div></div>`;
 const base=run.endless?Math.max(PLAYERS[player].bossTime-6,PLAYERS[player].time-run.wave+1):(run.isl.boss?PLAYERS[player].bossTime:PLAYERS[player].time);
 run.tTotal=base*1000;run.tLeft=run.tTotal;run.tStart=Date.now();let lastSec=99;
 timer=setInterval(()=>{run.tLeft-=100;const f=Math.max(0,run.tLeft/run.tTotal);const b=document.getElementById('tbar');if(!b){stopTimer();return;}
  b.style.width=(f*100)+'%';b.className=f<.25?'dang':f<.5?'warn':'';const sec=Math.ceil(run.tLeft/1000);document.getElementById('tleft').textContent='⏱️ '+Math.max(0,sec)+' sn';
  if(sec<=5&&sec<lastSec&&sec>0)sTick();lastSec=sec;
  if(run.tLeft<=0){stopTimer();answer(-1);}},100);
}
function setPhp(){const b=document.getElementById('phpbar');if(b)b.style.width=Math.max(0,run.php)+'%';const n=document.getElementById('phpn');if(n)n.textContent=Math.max(0,Math.round(run.php));}
function setGhp(){const b=document.getElementById('hpbar');if(b)b.style.width=Math.max(0,run.ghp/run.gmax*100)+'%';}
function usePow(id){
 if(run.answered||S().pw[id]<1)return;const q=run.qs[run.i];
 if(id==='half'){const wrong=shuffle(q.opts.map((o,k)=>k).filter(k=>q.opts[k]!==q.a)).slice(0,2);wrong.forEach(k=>document.getElementById('o'+k).classList.add('gone'));}
 if(id==='time'){run.tLeft+=15000;run.tTotal+=15000;}
 if(id==='heart'){if(run.php>=100)return;run.php=Math.min(100,run.php+30);setPhp();}
 S().pw[id]--;persist();badge('power');sCoin();
 const b=document.getElementById('pw-'+id);b.querySelector('b').textContent='x'+S().pw[id];if(S().pw[id]<1||id!=='time')b.disabled=true;
}
function answer(k){
 if(run.answered)return;run.answered=true;stopTimer();
 const q=run.qs[run.i],ok=k>=0&&q.opts[k]===q.a,spent=(Date.now()-run.tStart)/1000;
 document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.opts[j]===q.a)b.classList.add('ok');});
 document.getElementById('pows').style.display='none';
 let gain=0,msg='';
 if(ok){
  run.correct++;run.streak++;S().streak++;S().best=Math.max(S().best,S().streak);
  if(S().streak>=5)badge('s5');if(S().streak>=10)badge('s10');if(spent<=3)badge('fast');
  gain=10+Math.round(Math.max(0,run.tLeft/run.tTotal)*10);run.coins+=gain;if(run.endless)run.score+=5;
  sGood();msg=spent<=3?'⚡ Şimşek hızı!':['Harika!','Süper!','Aferin!','Bravo!','Mükemmel!','Müthiş!','Tam isabet!'][Math.floor(Math.random()*7)];
 }else{
  run.streak=0;S().streak=0;sBad();if(k>=0)document.getElementById('o'+k).classList.add('no');
 }
 persist();
 const crit=ok&&run.streak>=3;
 document.getElementById('fb').innerHTML=`<div class="exp ${ok?'good':'bad'}"><b>${ok?'✅ '+msg+` <span style="color:#b07a00">+${gain} 🪙</span>`:(k<0?'⏰ Süre doldu! Doğru cevap: ':'❌ Doğru cevap: ')+q.a}</b>${q.exp}</div>
 <button class="big ${ok?'':'def'}" onclick="phase('${ok?'atk':'def'}')">${ok?(crit?'🔥 KRİTİK SALDIRI!':'⚔️ SALDIR!'):'🛡️ SAVUN!'}</button>`;
 document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function banner(t){const b=document.getElementById('banner');if(!b)return;b.textContent=t;b.classList.remove('show');void b.offsetWidth;b.classList.add('show');}
function phase(type){
 stopTimer();const ar=document.getElementById('arena');if(!ar)return;
 document.getElementById('qpanel').classList.add('hide');document.getElementById('qtimer').classList.add('hide');
 ar.classList.add('act');window.scrollTo({top:0});
 const crit=type==='atk'&&run.streak>=3;
 banner(type==='atk'?(crit?'🔥 KRİTİK SALDIRI!':'⚔️ SALDIRI!'):'🛡️ KAÇ!');
 document.getElementById('phint').textContent=type==='atk'?'👆 Bekçiye dokun ve vur!':'👆 Parmağını sağa sola kaydır, kaç!';
 type==='atk'?sCrit():beep([[300,.15],[200,.2]],'sawtooth');
 setTimeout(()=>runPhase(type,crit),950);
}
function runPhase(type,crit){
 const ar=document.getElementById('arena');if(!ar)return;
 const W=ar.clientWidth,H=ar.clientHeight,me=document.getElementById('me'),foe=document.getElementById('foe'),ptb=document.getElementById('ptbar');
 const emre=player==='emre',lv=Math.min(run.lvl,14),sp=1+lv*0.09+(run.isl.boss?0.25:0);
 const dur=(type==='atk'?(emre?7:6):5)*1000;
 let hx=W/2,tx=W/2,fx=W/2,fy=90,t=0,last=performance.now(),lastShot=0,nextSpawn=600,done=false,dodged=0,hitsTaken=0;
 const proj=[],eproj=[],off=Math.random()*6;
 me.style.left=hx+'px';
 const pt=e=>{const r=ar.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
 const shoot=(x,y)=>{const now=performance.now();if(now-lastShot<260)return;lastShot=now;
  const el=document.createElement('div');el.className='proj';el.innerHTML=hero().shot;ar.appendChild(el);
  proj.push({el,x0:hx,y0:H-120,x1:x,y1:y,t:0,d:240});beep([[520,.05]],'square');};
 ar.onpointerdown=e=>{e.preventDefault();const[x,y]=pt(e);if(type==='atk')shoot(x,y);else tx=x;};
 ar.onpointermove=e=>{if(type==='def'){const[x]=pt(e);tx=x;}};
 function fx2(){const el=document.createElement('div');return el;}
 function hitFoe(dmg){
  run.ghp=Math.max(0,run.ghp-dmg);run.hits++;run.coins+=2;if(run.endless)run.score+=1;setGhp();
  foe.classList.remove('hitme');void foe.offsetWidth;foe.classList.add('hitme');
  const d=document.createElement('div');d.className='dmg';d.textContent='-'+dmg+(dmg>3?'!':'');d.style.left=fx+'px';d.style.top=(fy-50)+'px';ar.appendChild(d);setTimeout(()=>d.remove(),900);
  const b=document.createElement('div');b.className='boom';b.textContent=dmg>3?'💥':'✨';b.style.left=(fx-22)+'px';b.style.top=(fy-24)+'px';ar.appendChild(b);setTimeout(()=>b.remove(),600);
  dmg>3?sCrit():sGood();
  const pet=document.getElementById('pet');if(pet){pet.classList.remove('joy');void pet.offsetWidth;pet.classList.add('joy');}
 }
 function hurt(){
  run.php-=emre?8:10;hitsTaken++;setPhp();sBad();
  me.classList.remove('ouch');void me.offsetWidth;me.classList.add('ouch');
  const fl=document.createElement('div');fl.className='flash';document.body.appendChild(fl);setTimeout(()=>fl.remove(),420);
 }
 function end(){
  done=true;ar.onpointerdown=null;ar.onpointermove=null;proj.concat(eproj).forEach(p=>p.el.remove());
  if(type==='def'&&hitsTaken===0&&run.php>0){banner('🛡️ KUSURSUZ KAÇIŞ!');run.coins+=10;}
  setTimeout(()=>{
   if(run.ghp<=0){if(run.endless)nextWave();else finish(true);return;}
   if(run.php<=0){if(run.endless)endlessOver();else finish(false);return;}
   run.i++;question();
  },type==='def'&&hitsTaken===0?900:350);
 }
 function loop(now){
  if(done||!document.getElementById('arena'))return;
  const dt=Math.min(50,now-last);last=now;t+=dt;
  // bekçi hareketi
  const s=t/1000*sp;
  fx=W/2+(W/2-60)*Math.sin(s*1.25+off)*(type==='atk'?1:.8);
  fy=(type==='atk'?H*0.3:80)+(type==='atk'?H*0.12:24)*Math.sin(s*2.3+off*2);
  foe.style.left=fx+'px';foe.style.top=fy+'px';
  // kahraman
  if(type==='def'){hx+=(tx-hx)*Math.min(1,dt*0.014);hx=Math.max(40,Math.min(W-40,hx));me.style.left=hx+'px';}
  // oyuncu atışları
  for(let i=proj.length-1;i>=0;i--){const p=proj[i];p.t+=dt;const k=Math.min(1,p.t/p.d);const x=p.x0+(p.x1-p.x0)*k,y=p.y0+(p.y1-p.y0)*k;
   p.el.style.left=x+'px';p.el.style.top=y+'px';p.el.style.transform=`translate(-50%,-50%) rotate(${p.t*1.6}deg)`;
   if(Math.hypot(x-fx,y-fy)<50){hitFoe(crit?5:3);p.el.remove();proj.splice(i,1);continue;}
   if(k>=1){p.el.remove();proj.splice(i,1);}}
  // bekçi atışları
  if(type==='def'){
   nextSpawn-=dt;if(nextSpawn<=0){nextSpawn=Math.max(260,620-lv*25-(run.isl.boss?80:0))+(emre?160:0);
    const el=document.createElement('div');el.className='eproj';el.textContent=GSHOT[run.isl.g]||'🔥';ar.appendChild(el);
    const vy=(250+lv*16)*(emre?0.8:1)*(run.isl.boss?1.15:1),tt=(H-fy)/vy,aim=hx+(Math.random()-.5)*120;
    eproj.push({el,x:fx,y:fy+30,vx:(aim-fx)/tt,vy});}
   for(let i=eproj.length-1;i>=0;i--){const p=eproj[i];p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;p.el.style.left=p.x+'px';p.el.style.top=p.y+'px';
    if(Math.abs(p.x-hx)<32&&p.y>H-135&&p.y<H-15){hurt();p.el.remove();eproj.splice(i,1);continue;}
    if(p.y>H+20){dodged++;p.el.remove();eproj.splice(i,1);}}
  }
  ptb.style.width=Math.max(0,100-t/dur*100)+'%';
  if(t>=dur||run.ghp<=0||run.php<=0){
   if(run.ghp<=0){foe.style.transition='all .6s';foe.style.transform='translate(-50%,-50%) rotate(90deg) scale(.3)';foe.style.opacity='.2';}
   end();return;}
  requestAnimationFrame(loop);
 }
 requestAnimationFrame(loop);
}
function next(){run.i++;question();window.scrollTo({top:0});}
function quit(){stopTimer();modal(`<div style="font-size:50px">🏳️</div><h2>Savaştan çekilmek mi?</h2><p style="font-size:17px">Bu savaştaki ilerlemen kaybolur.</p><button class="big" onclick="closeModal();question()">Devam et, savaşacağım!</button><button class="big alt" onclick="closeModal();${run.endless?'endlessOver()':'map()'}">${run.endless?'Bitir ve puanı kaydet':'Haritaya dön'}</button>`);}

function finish(won){
 stopTimer();document.body.classList.remove('boss');const isl=run.isl,st=won?(run.php>=70?3:run.php>=35?2:1):0;
 const prev=S().stars[isl.id]||0,firstWin=won&&prev===0;
 if(won)S().stars[isl.id]=Math.max(prev,st);
 addCoins(run.coins);persist();
 if(won){badge('first');if(st===3)badge('perfect');if(isl.boss)badge('boss');
  const conq=ISLANDS.filter(x=>S().stars[x.id]>0).length;if(conq>=6)badge('half');if(totalStars(player)===MAXSTARS)badge('legend');
  sWin();confetti();}else sLose();
 const allDone=unlockedCount(player)>ISLANDS.length;
 const chestMax=won?(20+st*20+(isl.boss?100:0)):0;
 run.chest=won?Math.round((chestMax*.6+Math.random()*chestMax*.6)/5)*5:0;
 app.innerHTML=`<div class="panel res" style="margin-top:24px"><div class="e">${won?(st===3?'🏆':'🎉'):'🌊'}</div>
 <h2>${won?(isl.boss?'Kara Korsan yenildi!':isl.gn+' yenildi!'):'Yenildin!'}</h2>
 ${won?`<div class="stars">${stars(st)}</div>`:`<p style="margin:8px 0">${isl.gn} bu sefer kazandı… ama bir dahakine!</p>`}
 <p>${run.correct} doğru · ${run.hits} isabet · <b>+${run.coins} 🪙</b></p>
 ${firstWin?`<div class="loot"><div>${isl.item} ${isl.iname} kazandın!</div></div>`:''}
 ${won?`<p style="margin-top:6px;font-weight:800">Hazine sandığına dokun!</p><button class="chest" id="chest" onclick="openChest()">🧰</button><div id="chestres"></div>`:''}
 <p style="margin-top:6px;opacity:.75;font-size:16px">${won?(st<3?'Canını yüksek tutarsan 3 yıldız alırsın!':'Neredeyse hiç hasar almadın, efsanesin!'):'İpucu: Mağazadan güçlendirme alabilirsin 🛒'}</p>
 ${firstWin&&!isl.boss?`<p style="margin-top:6px;font-weight:800;color:#2e7d32">⛵ Yeni ada açıldı!</p>`:''}
 ${firstWin&&allDone?`<p style="margin-top:6px;font-weight:800;color:#b07a00">💰 Hazine Adası açıldı!</p>`:''}
 <button class="big" onclick="start('${isl.id}')">${won?'Tekrar oyna':'Tekrar dene'}</button>
 <button class="big alt" onclick="map()">Haritaya dön</button></div>`;
}
function openChest(){if(!run.chest)return;const n=run.chest;run.chest=0;addCoins(n);sCoin();confetti(['🪙','💎','✨']);
 const c=document.getElementById('chest');c.textContent='💰';c.style.animation='none';c.onclick=null;
 const gift=Math.random()<.35?POWERS[Math.floor(Math.random()*3)]:null;if(gift){S().pw[gift.id]++;persist();}
 document.getElementById('chestres').innerHTML=`<div class="loot"><div>+${n} 🪙</div>${gift?`<div style="animation-delay:.2s">+1 ${gift.e} ${gift.n}</div>`:''}</div>`;}
function treasure(){
 sWin();confetti(['💰','👑','💎','🪙']);
 app.innerHTML=`<div class="panel res" style="margin-top:24px"><div class="e">💰👑💎</div><h2>Hazineyi buldun, Kaptan ${PLAYERS[player].name}!</h2>
 <div class="stars" style="font-size:30px">⭐ ${totalStars(player)} / ${MAXSTARS}</div><p>Kasandaki altın: <b>${S().coins} 🪙</b></p>
 <p style="margin-top:8px;opacity:.75">${totalStars(player)<MAXSTARS?'Şimdi sıra bütün adalarda 3 yıldızda! Efsane Kaptan rozeti seni bekliyor 👑':'Bütün adalarda 3 yıldız! Sen gerçek bir bilgi efsanesisin!'}</p>
 <button class="big" onclick="map()">Haritaya dön</button></div>`;
}

// ---------- Sonsuz Okyanus ----------
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const fmt=n=>String(n).replace('-','−');
function mathQ(){
 const lv=player,t=lv==='emir'?rnd(0,4):rnd(0,3);let q,a,e;
 if(lv==='emir'){
  if(t===0){const x=rnd(12,25),y=rnd(3,9);a=x*y;q=`${x} × ${y} = ?`;e=`${x} × ${y} = ${a}.`;}
  if(t===1){let x=rnd(-20,20),y=rnd(-20,-1);a=x+y;q=`(${fmt(x)}) + (${fmt(y)}) = ?`;e=`Negatif sayı eklemek çıkarmak gibidir: ${fmt(x)} − ${-y} = ${fmt(a)}.`;}
  if(t===2){const p=[10,20,25,50,75][rnd(0,4)],n=rnd(1,20)*20;a=n*p/100;q=`${n} sayısının %${p}${({10:"'u",20:"'si",25:"'i",50:"'si",75:"'i"})[p]} kaçtır?`;e=`${n} × ${p} ÷ 100 = ${a}.`;}
  if(t===3){const n=rnd(2,15);a=n*n;q=`${n}² = ?`;e=`${n}² = ${n} × ${n} = ${a}.`;}
  if(t===4){const d=rnd(2,6),m=rnd(1,d-1),k=rnd(2,12),N=d*k;a=m*k;q=`${m}/${d} × ${N} = ?`;e=`${N} ÷ ${d} = ${k}, ${k} × ${m} = ${a}.`;}
 }else{
  if(t===0){const x=rnd(10,79),y=rnd(5,99-x);a=x+y;q=`${x} + ${y} = ?`;e=`${x} + ${y} = ${a}.`;}
  if(t===1){const x=rnd(20,99),y=rnd(3,x-1);a=x-y;q=`${x} − ${y} = ?`;e=`${x} − ${y} = ${a}.`;}
  if(t===2){const x=rnd(2,9),y=rnd(2,9);a=x*y;q=`${x} × ${y} = ?`;e=`${x} tane ${y}: ${a}.`;}
  if(t===3){const b=rnd(2,9),k=rnd(2,9),x=b*k;a=k;q=`${x} ÷ ${b} = ?`;e=`${b} × ${k} = ${x} olduğu için ${x} ÷ ${b} = ${k}.`;}
 }
 const w=new Set();const off=[1,-1,2,-2,10,-10,3,5];for(const o of shuffle(off)){const v=a+o;if(v!==a&&(lv==='emir'||v>=0))w.add(v);if(w.size===3)break;}
 return {q,a:fmt(a),opts:shuffle([a,...w].map(fmt)),exp:e,sub:'Matematik ⚡'};
}
function endlessQ(){
 if(Math.random()<.35)return mathQ();
 if(!run.bag||!run.bag.length){run.bag=[];for(const k in BANK[player])if(/\d$/.test(k))BANK[player][k].forEach(x=>run.bag.push([x,k.slice(0,3)]));run.bag=shuffle(run.bag);}
 const [x,s]=run.bag.pop();return {q:x[0],a:x[1],opts:shuffle([x[1],x[2],x[3],x[4]]),exp:x[5],sub:subj(s)};
}
function waveFoe(n){const boss=n%5===0;const b=boss?ISLANDS[12]:ISLANDS[rnd(0,11)];return {...b,s:'mix',boss};}
function endlessIntro(){modal(`<div style="font-size:64px">♾️🌊</div><h2>Sonsuz Okyanus</h2><p style="font-size:17px;margin-top:6px">Dalgalar hiç bitmez! Her dalgada bir bekçi gelir, gittikçe güçlenir ve süre kısalır. Her 5. dalgada Kara Korsan döner!</p><p style="font-size:16px;margin-top:6px;opacity:.75">Rekorun: ${S().ew?`${S().ew}. dalga · ${S().eb} puan`:'henüz yok'}</p><button class="big" onclick="closeModal();startEndless()">🌊 Dalgalara dal!</button><button class="big alt" onclick="closeModal()">Sonra</button>`);}
function startEndless(){const f=waveFoe(1);run={endless:true,wave:1,score:0,isl:f,qs:[],bag:null,i:0,php:100,lvl:0,gmax:70,ghp:70,correct:0,streak:0,coins:0,hits:0};document.body.classList.remove('boss');question();}
function nextWave(){
 run.wave++;const f=waveFoe(run.wave);run.isl=f;run.lvl=Math.min(run.wave-1,14);run.gmax=70+run.wave*15+(f.boss?40:0);run.ghp=run.gmax;
 const bonus=10*run.wave;run.coins+=bonus;let extra='';
 if(run.php<100){run.php=Math.min(100,run.php+20);extra=' · +20 ❤️';}
 if(run.wave>=5)badge('wave5');if(run.wave>=10)badge('wave10');
 document.body.classList.toggle('boss',!!f.boss);
 toast('🌊',`Dalga ${run.wave}! +${bonus} 🪙${extra}`);
 run.i++;question();window.scrollTo({top:0});
}
function endlessOver(){
 stopTimer();document.body.classList.remove('boss');
 const rec=run.score>S().eb;if(rec){S().eb=run.score;S().ew=run.wave;}
 addCoins(run.coins);persist();if(rec&&run.score>0){sWin();confetti(['🌊','🏆','⭐','🪙']);}else sLose();
 app.innerHTML=`<div class="panel res" style="margin-top:24px"><div class="e">${rec&&run.score>0?'🏆':'🌊'}</div>
 <h2>${rec&&run.score>0?'YENİ REKOR!':'Dalgalar seni yuttu!'}</h2>
 <p style="font-size:22px;font-weight:800;margin:8px 0">🌊 ${run.wave}. dalga · ⭐ ${run.score} puan</p>
 <p>${run.correct} doğru · <b>+${run.coins} 🪙</b></p>
 <p style="margin-top:6px;opacity:.75">En iyi rekorun: ${S().ew}. dalga · ${S().eb} puan</p>
 <p style="margin-top:6px;font-size:15px;opacity:.75">${PLAYERS[player==='emir'?'emre':'emir'].name}'in rekoru: ${save[player==='emir'?'emre':'emir'].eb} puan</p>
 <button class="big" onclick="startEndless()">🌊 Tekrar dal!</button><button class="big alt" onclick="map()">Haritaya dön</button></div>`;
}

// ---------- Mağaza ----------
function shop(){
 stopTimer();closeModal();
 app.innerHTML=`${topbar('map(false)','← Harita')}
 <h3 class="sec">🦸 Kahramanlar</h3><div class="grid">${Object.entries(HEROES).map(([id,h])=>`<div class="item"><div class="hcard ${h.flip?'flip':''}">${h.svg}</div><h4>${h.name}</h4><small>Atış: ${h.shotName}</small><button class="buy ${S().hero===id?'on':''}" onclick="useHero('${id}')">${S().hero===id?'✔ Seçili':'Seç'}</button></div>`).join('')}</div>
 <h3 class="sec">⚡ Güçlendirmeler</h3><div class="grid">${POWERS.map(p=>`<div class="item"><div class="ie">${p.e}</div><h4>${p.n}</h4><small>${p.d}<br>Elinde: ${S().pw[p.id]}</small>
  <button class="buy" onclick="buyPow('${p.id}')" ${S().coins<p.p?'disabled':''}>${p.p} 🪙</button></div>`).join('')}</div>
 <h3 class="sec">🚢 Gemiler</h3><div class="grid">${SHIPS.map(s=>{const own=S().ships.includes(s.id),on=S().ship===s.id;return `<div class="item"><div class="ie">${s.e}</div><h4>${s.n}</h4><small>Atış: ${s.shot}</small>
  ${own?`<button class="buy ${on?'on':''}" onclick="useShip('${s.id}')">${on?'✔ Kullanılıyor':'Seç'}</button>`:`<button class="buy" onclick="buyShip('${s.id}')" ${S().coins<s.p?'disabled':''}>${s.p} 🪙</button>`}</div>`;}).join('')}</div>`;
}
function buyPow(id){const p=POWERS.find(x=>x.id===id);if(S().coins<p.p)return;S().coins-=p.p;S().pw[id]++;persist();sCoin();shop();}
function buyShip(id){const s=SHIPS.find(x=>x.id===id);if(S().coins<s.p)return;S().coins-=s.p;S().ships.push(id);S().ship=id;persist();badge('ship');sWin();confetti([s.e,'✨']);shop();}
function useHero(id){S().hero=id;persist();sCoin();shop();}
function useShip(id){S().ship=id;persist();sCoin();shop();}

 const got=Object.keys(S().badges).length;
 app.innerHTML=`${topbar('map(false)','← Harita')}
 <h3 class="sec">🎒 Hazine Koleksiyonu (${ISLANDS.filter(i=>S().stars[i.id]>0).length}/${ISLANDS.length})</h3>

 <p class="legend" style="margin-top:8px">En uzun seri: 🔥 ${S().best} · Bulunan şişe: 🍾 ${Object.keys(S().bottles).length}/${FACTS.length}</p>
