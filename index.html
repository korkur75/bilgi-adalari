<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bilgi Adaları</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07111f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#07111f;--bg2:#0c1a2e;--panel:rgba(16,30,52,.82);--line:rgba(148,197,255,.16);--txt:#e6f0ff;--mut:#8aa3c2;--cy:#22d3ee;--am:#fbbf24;--gr:#34d399;--rd:#f43f5e;--vi:#a78bfa}
html,body{min-height:100%;background:var(--bg)}
body{font-family:Inter,system-ui,sans-serif;color:var(--txt);background:radial-gradient(1200px 700px at 50% -10%,#123a63 0%,transparent 60%),radial-gradient(900px 600px at 100% 100%,#0f2a3f 0%,transparent 60%),var(--bg);background-attachment:fixed;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow-x:hidden;user-select:none;-webkit-user-select:none}
h1,h2,h3,.dsp{font-family:'Exo 2',Inter,sans-serif;letter-spacing:.3px}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px;position:relative}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border-radius:14px;font-family:'Exo 2',Inter,sans-serif;font-weight:800;font-size:19px;letter-spacing:.5px;text-transform:uppercase;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,#fcd34d,#f59e0b);color:#2a1700;box-shadow:0 6px 0 #b45309,0 10px 24px rgba(245,158,11,.35)}
.btn.cy{background:linear-gradient(180deg,#67e8f9,#06b6d4);color:#042f3a;box-shadow:0 6px 0 #0e7490,0 10px 24px rgba(6,182,212,.3)}
.btn.gh{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt)}
.btn:disabled{filter:grayscale(1) brightness(.6)}
.mt{margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:700;font-size:14px;white-space:nowrap}
.ico{width:18px;height:18px;display:inline-block;vertical-align:-3px}
.coin{display:inline-block;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7c2 0 18%,#fbbf24 40%,#b45309 100%);box-shadow:0 0 6px rgba(251,191,36,.6);vertical-align:-2px}
/* Kaptan seçimi */
.logo{text-align:center;margin:26px 0 8px}
.logo h1{font-size:46px;font-weight:900;line-height:.95;background:linear-gradient(180deg,#fff,#93c5fd);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(56,189,248,.25)}
.logo p{color:var(--mut);margin-top:8px;font-size:15px}
.pc{display:flex;align-items:center;gap:14px;padding:14px;margin-top:14px;width:100%;text-align:left}
.pc .av{width:78px;height:96px;flex-shrink:0;border-radius:14px;background:linear-gradient(180deg,rgba(34,211,238,.15),rgba(167,139,250,.12));display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border:1px solid var(--line)}
.pc .av svg{height:92px;width:auto}
.pc h2{font-size:24px}
.pc small{color:var(--mut);font-size:14px}
.lvl{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:24px;padding:0 8px;border-radius:8px;background:linear-gradient(180deg,#a78bfa,#7c3aed);font-family:'Exo 2',Inter,sans-serif;font-weight:800;font-size:13px;color:#fff}
.xpb{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.xpb i{display:block;height:100%;background:linear-gradient(90deg,#a78bfa,#22d3ee)}
.flip svg{transform:scaleX(-1)}
/* Harita */
.top{display:flex;align-items:center;gap:10px;padding:10px 12px;position:sticky;top:6px;z-index:6}
.top .av{width:46px;height:56px;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.06);display:flex;align-items:flex-end;justify-content:center;flex-shrink:0}
.top .av svg{height:54px;width:auto}
.top .nm{flex:1;min-width:0}
.top .nm b{font-family:'Exo 2',Inter,sans-serif;font-size:17px}
.iconbtn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);display:grid;place-items:center;position:relative}
.iconbtn svg{width:22px;height:22px}
.dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--rd);border:2px solid var(--bg)}
.row{display:flex;gap:10px}
.tile{flex:1;padding:12px;display:flex;align-items:center;gap:10px;text-align:left}
.tile b{font-family:'Exo 2',Inter,sans-serif;font-size:16px;display:block}
.tile small{color:var(--mut);font-size:12.5px}
.tile .ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.mapbox{margin-top:12px;border-radius:20px;overflow:hidden;border:1px solid var(--line);position:relative}
.mapbox svg{display:block;width:100%;height:auto}
.isl{cursor:pointer}
.isl:active{opacity:.8}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(2,8,18,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fi .2s}
.modal.c{align-items:center;padding:20px}
.modal .sheet{width:100%;max-width:560px;padding:20px 18px calc(20px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;animation:su .25s ease-out}
.modal.c .sheet{border-radius:22px;animation:pop .22s}
@keyframes fi{from{opacity:0}}@keyframes su{from{transform:translateY(40px);opacity:0}}@keyframes pop{from{transform:scale(.9);opacity:0}}
.sheet h2{font-size:26px;line-height:1.1}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kv div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.kv small{display:block;color:var(--mut);font-size:12px}
.kv b{font-family:'Exo 2',Inter,sans-serif;font-size:16px}
.warn{color:#fca5a5;font-size:14px;margin-top:10px}
/* Soru turu */
.qh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.steps{display:flex;gap:5px;flex:1}
.steps i{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.1)}
.steps i.ok{background:var(--gr)}.steps i.no{background:var(--rd)}.steps i.cur{background:var(--cy);box-shadow:0 0 10px var(--cy)}
.qcard{padding:18px}
.subj{display:inline-block;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--cy);margin-bottom:8px}
.q{font-size:22px;font-weight:700;line-height:1.35;margin-bottom:16px}
.tbar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:14px}
.tbar i{display:block;height:100%;width:100%;background:var(--cy);transition:width .1s linear}
.tbar i.w{background:var(--am)}.tbar i.d{background:var(--rd)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1.5px solid var(--line);font-size:18px;font-weight:600;transition:transform .1s,background .2s,border-color .2s}
.opt:active{transform:scale(.98)}
.opt .k{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.08);font-family:'Exo 2',Inter,sans-serif;font-weight:800;font-size:15px;flex-shrink:0}
.opt.ok{background:rgba(52,211,153,.16);border-color:var(--gr)}.opt.ok .k{background:var(--gr);color:#022c1e}
.opt.no{background:rgba(244,63,94,.16);border-color:var(--rd)}.opt.no .k{background:var(--rd)}
.opt.gone{opacity:.15;pointer-events:none}
.pows{display:flex;gap:8px;margin-top:12px}
.pow{flex:1;padding:9px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:700;font-size:14px}
.pow:disabled{opacity:.35}
.exp{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:16px;line-height:1.45;color:#cfe0f5}
.exp.g{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.35)}.exp.b{background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.35)}
.exp b{display:block;font-family:'Exo 2',Inter,sans-serif;font-size:18px;color:#fff;margin-bottom:2px}
.ring{width:150px;height:150px;margin:6px auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font-family:'Exo 2',Inter,sans-serif;font-weight:900;font-size:42px}
.res{text-align:center;padding:22px 18px}
.res h2{font-size:30px}
.res p{color:var(--mut);margin-top:6px}
.perk{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);margin-top:8px;font-size:15px}
/* Savaş */
#bt{position:fixed;inset:0;background:#000;z-index:40;touch-action:none;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none;font-family:'Exo 2',Inter,sans-serif;z-index:2}
.hud .tl{position:absolute;left:calc(12px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));display:flex;gap:10px;align-items:center}
.hud .pa{width:52px;height:52px;border-radius:14px;overflow:hidden;background:rgba(7,17,31,.75);border:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;position:relative}
.hud .pa svg{height:50px;width:auto}
.hud .pa .lvl{position:absolute;bottom:-1px;right:-1px;height:20px;min-width:24px;font-size:12px;border-radius:7px}
.bars{width:170px}
.hpb{height:16px;border-radius:6px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);overflow:hidden;position:relative}
.hpb i{display:block;height:100%;background:linear-gradient(180deg,#4ade80,#16a34a);transition:width .15s}
.hpb span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000}
.xpb2{height:6px;border-radius:99px;background:rgba(0,0,0,.5);overflow:hidden;margin-top:5px}
.xpb2 i{display:block;height:100%;background:linear-gradient(90deg,#a78bfa,#22d3ee);transition:width .3s}
.hud .tr{position:absolute;right:calc(12px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.hud .tr .chip{background:rgba(7,17,31,.75);font-family:'Exo 2',Inter,sans-serif}
#mm{width:96px;height:96px;border-radius:50%;background:rgba(7,17,31,.6);border:1px solid var(--line)}
.pause{pointer-events:auto;width:38px;height:38px;border-radius:11px;background:rgba(7,17,31,.75);border:1px solid var(--line);display:grid;place-items:center}
.bossbar{position:absolute;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);width:min(70vw,460px);text-align:center;display:none}
.bossbar b{font-size:15px;letter-spacing:1px;text-transform:uppercase;text-shadow:0 2px 6px #000}
.bossbar .hpb{height:14px;margin-top:4px;border-color:rgba(244,63,94,.6)}
.bossbar .hpb i{background:linear-gradient(180deg,#fb7185,#be123c)}
.wavebn{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;opacity:0;white-space:nowrap}
.wavebn b{display:block;font-size:44px;font-weight:900;text-shadow:0 4px 18px rgba(0,0,0,.7)}
.wavebn small{font-size:17px;color:#cbd5e1;font-family:Inter;font-weight:600}
.wavebn.show{animation:wb 2.2s forwards}
@keyframes wb{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.ctrl{position:absolute;inset:0;pointer-events:auto;z-index:1}
.joy{position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.18);transform:translate(-50%,-50%);display:none}
.joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.55),rgba(255,255,255,.18));border:2px solid rgba(255,255,255,.5)}
.joyhint{position:absolute;left:calc(40px + env(safe-area-inset-left));bottom:calc(40px + env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;border:2px dashed rgba(255,255,255,.18);display:grid;place-items:center;color:rgba(255,255,255,.35);font-size:12px;font-weight:700;text-align:center;pointer-events:none}
.abtns{position:absolute;right:calc(18px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:230px;height:230px;pointer-events:none}
.ab{position:absolute;border-radius:50%;pointer-events:auto;display:grid;place-items:center;border:2px solid rgba(255,255,255,.35);touch-action:none}
.ab svg{width:44%;height:44%;pointer-events:none}
.ab.atk{width:96px;height:96px;right:6px;bottom:6px;background:radial-gradient(circle at 40% 35%,#fda4af,#e11d48 60%,#881337);box-shadow:0 0 24px rgba(225,29,72,.5)}
.ab.atk.on{transform:scale(.93);filter:brightness(1.2)}
.ab.sk{width:60px;height:60px;background:radial-gradient(circle at 40% 35%,#c4b5fd,#7c3aed 65%,#3b0764)}
.ab.sk .cd{position:absolute;inset:-2px;border-radius:50%;pointer-events:none}
.ab.sk .cdt{position:absolute;font-family:'Exo 2',Inter,sans-serif;font-weight:900;font-size:18px;text-shadow:0 1px 3px #000;pointer-events:none}
.ab.sk.lock{display:none}
.ab.sk small{display:none;position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;white-space:nowrap;text-shadow:0 1px 3px #000;pointer-events:none}
.pausebox{position:absolute;inset:0;background:rgba(2,8,18,.75);display:grid;place-items:center;pointer-events:auto;padding:20px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:10px 16px;border-radius:14px;background:rgba(16,30,52,.95);border:1px solid var(--line);font-weight:700;z-index:60;display:flex;gap:10px;align-items:center;animation:tst 3s forwards;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast .te{font-size:26px}
@keyframes tst{0%{transform:translate(-50%,120px)}10%,85%{transform:translate(-50%,0)}100%{transform:translate(-50%,120px)}}
/* Hangar */
.sec{font-family:'Exo 2',Inter,sans-serif;font-size:20px;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{padding:12px;text-align:center}
.card .hv{height:120px;display:flex;justify-content:center}
.card .hv svg{height:100%;width:auto}
.card h4{font-family:'Exo 2',Inter,sans-serif;font-size:16px;margin-top:6px}
.card small{color:var(--mut);font-size:12.5px;display:block;min-height:32px}
.buy{margin-top:8px;width:100%;padding:9px;border-radius:11px;font-weight:800;background:linear-gradient(180deg,#fcd34d,#f59e0b);color:#2a1700}
.buy:disabled{background:rgba(255,255,255,.08);color:var(--mut)}
.buy.on{background:linear-gradient(180deg,#6ee7b7,#10b981);color:#022c1e}
.upg{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px}
.upg .ui{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.upg .pips{display:flex;gap:4px;margin-top:5px}.upg .pips i{width:18px;height:6px;border-radius:3px;background:rgba(255,255,255,.12)}.upg .pips i.f{background:var(--am)}
.upg .buy{width:auto;padding:9px 12px;margin:0;white-space:nowrap}
.pw{display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:8px}
.pw .pi{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#c4b5fd,#7c3aed 65%,#3b0764);flex-shrink:0}
.pw .pi svg{width:22px;height:22px}
.pw.lk{opacity:.45}.pw.lk .pi{filter:grayscale(1)}
.bdg{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:8px}
.bdg .bi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:rgba(251,191,36,.15);flex-shrink:0}
.bdg.no{opacity:.4}
.conf{position:fixed;top:-20px;width:9px;height:14px;pointer-events:none;z-index:70;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.reset{display:block;margin:26px auto 0;color:var(--mut);font-size:13px;text-decoration:underline}
</style>
</head>

<div class="wrap" id="app"><p id="ld" style="text-align:center;margin-top:40vh;color:#8aa3c2;font:600 16px sans-serif">Bilgi Adaları yükleniyor…</p></div>
<script>
var errShown=0;function showErr(err){try{console.error(err);if(errShown++)return;var d=document.createElement('div');d.style.cssText='position:fixed;left:10px;right:10px;bottom:10px;z-index:99;background:#7f1d1d;color:#fff;padding:12px;border-radius:12px;font:13px/1.4 monospace;white-space:pre-wrap';d.textContent='Hata: '+((err&&err.message)||err)+'\n'+(((err&&err.stack)||'')+'').split('\n').slice(0,3).join('\n')+'\n(Bu ekranın fotoğrafını Claude\'a gönder)';d.onclick=function(){d.remove();};document.body.appendChild(d);}catch(x){}}
window.addEventListener('error',function(e){showErr(e.error||(e.message+' @'+e.lineno));});window.addEventListener('unhandledrejection',function(e){showErr(e.reason);});
setTimeout(function(){var l=document.getElementById('ld');if(l)l.textContent='Oyun başlatılamadı. Sayfayı yenileyin; düzelmezse bu ekranın fotoğrafını Claude\'a gönderin.';},6000);
</script>

let actx=null;
function ac(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}return actx;}
function beep(notes,type,vol){const a=ac();if(!a)return;let t=a.currentTime;notes.forEach(([f,d])=>{const o=a.createOscillator(),g=a.createGain();o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d);t+=d*.8;});}
function noise(d,vol,freq){const a=ac();if(!a)return;const n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
 const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||1200;const g=a.createGain();g.gain.value=vol||.25;s.connect(f).connect(g).connect(a.destination);s.start();}
const SFX={ok:()=>beep([[660,.1],[880,.16]]),no:()=>beep([[220,.25]],'sawtooth',.08),win:()=>beep([[523,.14],[659,.14],[784,.14],[1046,.34]]),
 coin:()=>beep([[988,.06],[1319,.12]],'square',.05),shoot:()=>beep([[880,.04],[620,.05]],'square',.03),hit:()=>noise(.08,.12,2500),boom:()=>noise(.45,.35,700),
 hurt:()=>beep([[180,.12]],'sawtooth',.1),lvl:()=>beep([[523,.1],[659,.1],[784,.1],[1046,.1],[1319,.3]],'square',.07),tick:()=>beep([[1200,.03]],'square',.04),
 zap:()=>{noise(.2,.2,4000);beep([[1400,.05],[700,.1]],'sawtooth',.05);},dash:()=>noise(.15,.15,1800),lose:()=>beep([[392,.2],[330,.2],[262,.45]])};

function seeded(n){let s=n*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
function blobPath(cx,cy,r,seed,k){const R=seeded(seed);const pts=[];const n=14;const a1=R()*6,a2=R()*6,f1=2+Math.floor(R()*2),f2=4+Math.floor(R()*2);
 for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const rr=r*(1+.14*Math.sin(f1*a+a1)+.07*Math.sin(f2*a+a2))*(k||1);pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*.82]);}
 let d='';for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;d+=(i?'':`M${(pts[n-1][0]+p[0])/2},${(pts[n-1][1]+p[1])/2} `)+`Q${p[0]},${p[1]} ${mx},${my} `;}return d+'Z';}

const fmt=n=>String(n).replace('-','−');
function mathQ(){
 const t=rnd(0,4);let q,a,e;
 if(player==='emir'){
  if(t===0){const x=rnd(12,25),y=rnd(3,9);a=x*y;q=`${x} × ${y} = ?`;e=`${x} × ${y} = ${a}.`;}
  if(t===1){const x=rnd(-20,20),y=rnd(-20,-1);a=x+y;q=`(${fmt(x)}) + (${fmt(y)}) = ?`;e=`Negatif sayı eklemek çıkarmak gibidir: ${fmt(x)} − ${-y} = ${fmt(a)}.`;}
  if(t===2){const p=[10,20,25,50,75][rnd(0,4)],n=rnd(1,20)*20;a=n*p/100;q=`${n} sayısının %${p}${({10:"'u",20:"'si",25:"'i",50:"'si",75:"'i"})[p]} kaçtır?`;e=`${n} × ${p} ÷ 100 = ${a}.`;}
  if(t===3){const n=rnd(2,15);a=n*n;q=`${n}² = ?`;e=`${n}² = ${n} × ${n} = ${a}.`;}
  if(t===4){const d=rnd(2,6),m=rnd(1,d-1),k=rnd(2,12),N=d*k;a=m*k;q=`${m}/${d} × ${N} = ?`;e=`${N} ÷ ${d} = ${k}, ${k} × ${m} = ${a}.`;}
 }else{
  if(t===0){const x=rnd(120,599),y=rnd(105,399);a=x+y;q=`${x} + ${y} = ?`;e=`${x} + ${y} = ${a}.`;}
  if(t===1){const x=rnd(300,999),y=rnd(101,x-50);a=x-y;q=`${x} − ${y} = ?`;e=`${x} − ${y} = ${a}.`;}
  if(t===2){const x=rnd(12,40),y=rnd(2,5);a=x*y;q=`${x} × ${y} = ?`;e=`${x} × ${y} = ${a}.`;}
  if(t===3){const b=rnd(2,9),k=rnd(2,10),x=b*k;a=k;q=`${x} ÷ ${b} = ?`;e=`${b} × ${k} = ${x} olduğu için ${x} ÷ ${b} = ${k}.`;}
  if(t===4){let n=rnd(11,989);if(n%10===0)n+=3;a=Math.round(n/10)*10;q=`${n} sayısını en yakın onluğa yuvarla.`;e=`Birler basamağı ${n%10}: ${n%10>=5?'5 veya daha büyük, yukarı':'5\'ten küçük, aşağı'} yuvarlanır → ${a}.`;
   const ws=[a+10,a-10>0?a-10:a+20,n].filter(v=>v!==a);return {q,a:String(a),opts:shuffle([a,...ws].map(String)),exp:e,sub:'Matematik'};}
 }
 const w=new Set();for(const o of shuffle(player==='emir'?[1,-1,2,-2,10,-10,3,5]:[1,-1,10,-10,100,-100,2])){const v=a+o;if(v!==a&&(player==='emir'||v>=0))w.add(v);if(w.size===3)break;}
 return {q,a:fmt(a),opts:shuffle([a,...w].map(fmt)),exp:e,sub:'Matematik'};
}
const toQ=(x,sub)=>({q:x[0],a:x[1],opts:shuffle([x[1],x[2],x[3],x[4]]),exp:x[5],sub});
function quizPool(id){
 if(id==='arena'||id==='final'){const all=[];for(const k in BANK[player])if(/\d$/.test(k))BANK[player][k].forEach(x=>all.push(toQ(x,subj(k.slice(0,3)))));
  const out=shuffle(all).slice(0,6);out.push(mathQ(),mathQ());return shuffle(out);}
 const isl=ISLANDS.find(x=>x.id===id);const out=shuffle(BANK[player][id]).slice(0,isl.s==='mat'?6:8).map(x=>toQ(x,subj(isl.s)));
 while(out.length<8)out.push(mathQ());return shuffle(out);
}

 <div class="qcard glass"><div style="display:flex;justify-content:space-between;align-items:center"><span class="subj">${q.sub}</span><span id="tl" style="color:var(--mut);font-weight:700;font-size:14px"></span></div>

 <div id="fb"></div></div>`;
 Q.tT=PLAYERS[player].time*1000;Q.tL=Q.tT;Q.t0=Date.now();let ls=99;
 qt=setInterval(()=>{Q.tL-=100;const f=Math.max(0,Q.tL/Q.tT),b=document.getElementById('tb');if(!b){stopQT();return;}
  b.style.width=f*100+'%';b.className=f<.25?'d':f<.5?'w':'';const sec=Math.ceil(Q.tL/1000);document.getElementById('tl').textContent=Math.max(0,sec)+' sn';

function useHelp(id){
 if(Q.answered||S().qh[id]<1)return;const q=Q.qs[Q.i];
 if(id==='half')shuffle(q.opts.map((o,k)=>k).filter(k=>q.opts[k]!==q.a)).slice(0,2).forEach(k=>document.getElementById('o'+k).classList.add('gone'));
 if(id==='time'){Q.tL+=15000;Q.tT+=15000;}
 S().qh[id]--;persist();SFX.coin();const b=document.getElementById('h-'+id);b.disabled=true;b.querySelector('span').textContent='×'+S().qh[id];
}
function answerQ(k){
 if(Q.answered)return;Q.answered=true;stopQT();
 const q=Q.qs[Q.i],ok=k>=0&&q.opts[k]===q.a;Q.res.push(ok);
 document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.opts[j]===q.a)b.classList.add('ok');});
 if(!ok&&k>=0)document.getElementById('o'+k).classList.add('no');
 document.getElementById('pows').style.display='none';ok?SFX.ok():SFX.no();
 const last=Q.i===Q.qs.length-1;
 document.getElementById('fb').innerHTML=`<div class="exp ${ok?'g':'b'}"><b>${ok?'Doğru!':(k<0?'Süre doldu':'Yanlış')+' · Doğru cevap: '+q.a}</b>${q.exp}</div>
 <button class="btn cy mt" onclick="${last?'quizResult()':'Q.i++;renderQ()'}">${last?'Sonuçları gör':'Sonraki soru'}</button>`;
 document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

const WORLD=1800,CX=900,CY=900;
function islandShape(seed){const R=seeded(seed);const p1=R()*6,p2=R()*6,p3=R()*6,base=700;const arr=[];
 for(let i=0;i<360;i++){const a=i/360*Math.PI*2;arr.push(base*(1+.08*Math.sin(3*a+p1)+.05*Math.sin(5*a+p2)+.03*Math.sin(9*a+p3)));}
 return a=>{let d=((a%(Math.PI*2))+Math.PI*2)%(Math.PI*2);return arr[Math.floor(d/(Math.PI*2)*360)%360];};}
function shapePath(c,R,off){c.beginPath();for(let i=0;i<=120;i++){const a=i/120*Math.PI*2,r=R(a)+off;const x=CX+Math.cos(a)*r,y=CY+Math.sin(a)*r;i?c.lineTo(x,y):c.moveTo(x,y);}c.closePath();}
function walkable(x,y,pad){const dx=x-CX,dy=y-CY;return Math.hypot(dx,dy)<B.R(Math.atan2(dy,dx))-pad;}
function pStats(){const s=S(),b=B.bonus;return{
 maxhp:Math.round((100+(s.lvl-1)*15+s.upg.hp*20)*b.hpMul),
 dmg:(12+(s.lvl-1)*2.2)*(1+.15*s.upg.dmg)*b.dmgMul,
 spd:200*(1+.07*s.upg.spd)};}

 const T=THEMES[isl.th],seed=arena?rnd(50,99):ISLANDS.indexOf(isl)+11;
 B={cfg,arena,isl,T,R:islandShape(seed),seed,bonus:(Q&&Q.bonus)||{hpMul:1,dmgMul:1,superReady:false},

 if(B.bonus.superReady)B.freeNova=1;

function buildDecos(){
 const R=seeded(B.seed*13+5),types=B.T.deco;
 for(let i=0;i<46;i++){const a=R()*Math.PI*2,d=R()*(B.R(a)-130);const x=CX+Math.cos(a)*d,y=CY+Math.sin(a)*d;
  if(Math.hypot(x-CX,y-(CY+80))<190)continue;const tp=types[Math.floor(R()*types.length)];
  const col={rock:26+R()*16,crate:22,pillar:24,crystal:20,ice:20,palm:12,tree:14,deadtree:10,lava:0}[tp];
  B.decos.push({x,y,tp,r:col,s:.8+R()*.5,rot:R()*6.28});}
}

function resize(){if(!B)return;const dpr=Math.min(2,window.devicePixelRatio||1),W=window.innerWidth,H=window.innerHeight;B.dpr=dpr;B.W=W;B.H=H;B.cv.width=W*dpr;B.cv.height=H*dpr;

function prerender(){
 const T=B.T,o=document.createElement('canvas');o.width=WORLD;o.height=WORLD;const c=o.getContext('2d'),R=seeded(B.seed*7+1);
 c.fillStyle=T.sea;c.fillRect(0,0,WORLD,WORLD);
 c.strokeStyle='rgba(255,255,255,.05)';c.lineWidth=3;for(let i=0;i<220;i++){const x=R()*WORLD,y=R()*WORLD;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+14,y-7,x+28,y);c.stroke();}
 c.globalAlpha=.45;c.fillStyle=T.shal;shapePath(c,B.R,130);c.fill();c.globalAlpha=.65;shapePath(c,B.R,60);c.fill();c.globalAlpha=1;
 c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=12;shapePath(c,B.R,16);c.stroke();c.strokeStyle='rgba(255,255,255,.15)';c.lineWidth=6;shapePath(c,B.R,40);c.stroke();
 c.fillStyle=T.sand;shapePath(c,B.R,0);c.fill();
 c.fillStyle=T.g1;shapePath(c,B.R,-55);c.fill();
 c.save();shapePath(c,B.R,-60);c.clip();
 for(let i=0;i<700;i++){const a=R()*6.28,d=R()*700,x=CX+Math.cos(a)*d,y=CY+Math.sin(a)*d,r=8+R()*42;c.globalAlpha=.25+R()*.3;c.fillStyle=R()<.5?T.g2:T.g3;c.beginPath();c.ellipse(x,y,r,r*(.6+R()*.4),R()*3,0,7);c.fill();}
 c.globalAlpha=1;
 if(B.isl.th==='lava'){c.strokeStyle='rgba(249,115,22,.55)';c.lineWidth=3;for(let i=0;i<60;i++){let x=CX+(R()-.5)*1300,y=CY+(R()-.5)*1300;c.beginPath();c.moveTo(x,y);for(let k=0;k<5;k++){x+=(R()-.5)*70;y+=(R()-.5)*70;c.lineTo(x,y);}c.stroke();}}
 if(['grass','ruin','gold','dark'].includes(B.isl.th)){c.strokeStyle=T.g3;c.lineWidth=2;for(let i=0;i<900;i++){const x=CX+(R()-.5)*1400,y=CY+(R()-.5)*1400;c.beginPath();c.moveTo(x,y);c.lineTo(x+(R()-.5)*6,y-6-R()*6);c.stroke();}}
 if(B.isl.th==='ice'||B.isl.th==='crystal'){c.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<300;i++){c.fillRect(CX+(R()-.5)*1400,CY+(R()-.5)*1400,2,2);}}
 if(B.isl.th==='metal'||B.isl.th==='fortress'){c.strokeStyle='rgba(0,0,0,.18)';c.lineWidth=2;for(let x=CX-700;x<CX+700;x+=90){c.beginPath();c.moveTo(x,CY-700);c.lineTo(x,CY+700);c.stroke();}for(let y=CY-700;y<CY+700;y+=90){c.beginPath();c.moveTo(CX-700,y);c.lineTo(CX+700,y);c.stroke();}}
 // başlangıç platformu
 c.globalAlpha=.5;c.strokeStyle=T.glow;c.lineWidth=3;c.beginPath();c.arc(CX,CY+80,70,0,7);c.stroke();c.globalAlpha=.12;c.fillStyle=T.glow;c.fill();c.globalAlpha=1;
 c.restore();
 B.decos.sort((a,b)=>a.y-b.y).forEach(d=>drawDeco(c,d));
 B.off=o;
 const m=document.createElement('canvas');m.width=192;m.height=192;const mc=m.getContext('2d');mc.scale(192/WORLD,192/WORLD);mc.fillStyle=T.sand;shapePath(mc,B.R,0);mc.fill();mc.fillStyle=T.g1;shapePath(mc,B.R,-55);mc.fill();B.mmBg=m;
}
function drawDeco(c,d){
 const {x,y,s}=d;c.save();c.translate(x,y);c.scale(s,s);
 const sh=(rx,ry,oy)=>{c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(6,oy||8,rx,ry,0,0,7);c.fill();};

function banner(t,s){const b=document.getElementById('wb');if(!b)return;document.getElementById('wbT').textContent=t;document.getElementById('wbS').textContent=s||'';b.classList.remove('show');void b.offsetWidth;b.classList.add('show');}
function nextWave(){
 if(!B)return;B.wave++;B.state='fight';const lv=B.arena?1+Math.floor(B.wave*.6):B.isl.lv;B.lvE=lv;
 const plan=[];let boss=false;
 if(B.arena){const n=3+B.wave;boss=B.wave%5===0;for(let i=0;i<(boss?Math.floor(B.wave/2):n);i++)plan.push(['drone','crab','turret'][i%3]);}
 else{const extra=Math.floor(B.isl.lv/3);
  if(B.wave===1)for(let i=0;i<4+extra;i++)plan.push(i%2?'crab':'drone');
  else if(B.wave===2)for(let i=0;i<6+extra;i++)plan.push(['drone','crab',B.isl.lv>=2?'turret':'drone'][i%3]);
  else{boss=true;for(let i=0;i<2+extra;i++)plan.push('drone');}}
 document.getElementById('wvC').textContent=B.arena?`Dalga ${B.wave}`:`Dalga ${B.wave}/3`;
 if(boss){banner(B.isl.boss||'BOSS','Boss geliyor!');spawnEnemy('boss',lv);beep([[110,.5],[90,.6]],'sawtooth',.12);}
 else banner(`${B.wave}. DALGA`,B.wave===1?(B.arena?'Ne kadar dayanabilirsin?':'Adadaki botları temizle!'):'');
 plan.forEach((tp,i)=>setTimeout(()=>spawnEnemy(tp,lv),400+i*350));
}
function spawnPoint(){for(let k=0;k<60;k++){const a=Math.random()*6.28,d=380+Math.random()*340,x=B.p.x+Math.cos(a)*d,y=B.p.y+Math.sin(a)*d;if(walkable(x,y,90))return[x,y];}return[CX+(Math.random()-.5)*400,CY-250];}
function spawnEnemy(tp,lv){
 if(!B||B.state==='end')return;const [x,y]=spawnPoint(),s=1+(lv-1)*.2,em=player==='emre'?.8:1;
 const base={drone:{r:16,hp:34,spd:120},crab:{r:20,hp:55,spd:85},turret:{r:22,hp:80,spd:0},boss:{r:50,hp:520+lv*120,spd:70}}[tp];
 const hp=tp==='boss'?base.hp*(player==='emre'?.85:1):base.hp*s;
 const e={tp,x,y,r:base.r,hp,max:hp,spd:base.spd*(1+(lv-1)*.04),s,em,spawn:.7,cd:1+Math.random()*1.5,hit:0,ang:0,phase:0,t:Math.random()*10,vx:0,vy:0,state:'move',st:0,summon:0};
 B.enemies.push(e);if(tp==='boss'){B.boss=e;document.getElementById('bb').style.display='block';document.getElementById('bbN').textContent=B.isl.boss||'Boss';}

 if(id==='bolt'){const hitL=[];let from=[p.x,p.y-30],rng=520;for(let k=0;k<4;k++){let best=null,bd=rng;B.enemies.forEach(e=>{if(e.spawn>0||hitL.includes(e))return;const d=Math.hypot(e.x-from[0],e.y-from[1]);if(d<bd){bd=d;best=e;}});if(!best)break;
   B.fx.push({tp:'bolt',a:from.slice(),b:[best.x,best.y-10],life:.28,max:.28});hitL.push(best);damage(best,B.st.dmg*3.5,true);from=[best.x,best.y];rng=320;}
  if(!hitL.length)B.fx.push({tp:'bolt',a:[p.x,p.y-30],b:[p.x+p.face*160,p.y-40],life:.2,max:.2});SFX.zap();B.shake=Math.max(B.shake,6);}
 if(id==='nova'){B.fx.push({tp:'nova',x:p.x,y:p.y,r:0,life:.45,max:.45,done:new Set()});SFX.boom();B.shake=14;}

function damage(e,amt,big){

 if(e.hp<=0)kill(e);
}
function kill(e){
 e.dead=true;B.enemies=B.enemies.filter(x=>x!==e);const isB=e.tp==='boss';
 SFX.boom();B.shake=Math.max(B.shake,isB?22:6);
 for(let i=0;i<(isB?60:18);i++){const a=Math.random()*6.28,v=80+Math.random()*(isB?420:240);B.parts.push({tp:Math.random()<.5?'debris':'smoke',x:e.x,y:e.y-10,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.5+Math.random()*.6,max:1.1,col:Math.random()<.5?'#475569':B.T.glow,size:3+Math.random()*(isB?10:5)});}
 B.fx.push({tp:'ring',x:e.x,y:e.y,r:0,R:isB?260:80,life:.4,max:.4,col:'#fff'});
 const lv=B.lvE||1,coinV=isB?(80+lv*20):(4+lv),nC=isB?16:3,xp=isB?(100+lv*20):(8+2*lv);
 for(let i=0;i<nC;i++){const a=Math.random()*6.28,v=60+Math.random()*180;B.coins.push({x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,v:Math.ceil(coinV/nC),t:0});}
 B.kills++;S().kills++;if(S().kills>=100)badge('kills');
 if(isB){S().bosses++;if(S().bosses>=5)badge('bosses');B.boss=null;document.getElementById('bb').style.display='none';}
 B.xpGot+=xp;const ups=gainXP(xp);if(ups.length)onLevelUp(ups);
 B.texts.push({x:e.x,y:e.y-e.r-40,txt:`+${xp} XP`,col:'#c4b5fd',size:16,life:1});
 if(!B.enemies.length&&B.state==='fight'){
  if(!B.arena&&B.wave>=3){B.state='won';B.endT=2.2;B.coins.forEach(c=>c.t=1);}
  else{B.state='between';setTimeout(()=>{if(B&&B.state==='between'){if(B.arena&&B.wave%3===0&&B.p.hp<B.p.maxhp){B.p.hp=Math.min(B.p.maxhp,B.p.hp+B.p.maxhp*.25);B.texts.push({x:B.p.x,y:B.p.y-90,txt:'+%25 CAN',col:'#4ade80',size:20,life:1.2});}nextWave();}},1500);}}
}

 const p=POWERS.find(x=>ups.includes(x.lv));SFX.lvl();banner(`SEVİYE ${l}!`,p?`Yeni güç: ${p.n}`:'Can doldu, güç arttı');

 p.hp-=amt;p.inv=.45;B.hurtFlash=.35;B.shake=Math.max(B.shake,8);SFX.hurt();

// ---------- Döngü ----------
function loop(now){
 if(!B)return;const dt=Math.min(.05,(now-B.last)/1000);B.last=now;
 try{if(!B.paused)update(dt);if(!B)return;render();}catch(err){showErr(err);}
 if(B)requestAnimationFrame(loop);
}
function nearest(x,y,max){let best=null,bd=max;B.enemies.forEach(e=>{if(e.spawn>0)return;const d=Math.hypot(e.x-x,e.y-y);if(d<bd){bd=d;best=e;}});return best;}
function collideDecos(o,r){for(const d of B.decos){if(!d.r)continue;const rr=d.r*d.s+r,dx=o.x-d.x,dy=o.y-d.y,m=Math.hypot(dx,dy);if(m<rr&&m>0){o.x=d.x+dx/m*rr;o.y=d.y+dy/m*rr;}}}
function update(dt){
 B.t+=dt;const p=B.p,em=player==='emre'?.8:1;
 for(const k in B.cd)B.cd[k]=Math.max(0,B.cd[k]-dt);
 // hareket
 let mx=0,my=0;if(B.joy){mx=B.joy.x;my=B.joy.y;}
 const K=B.keys;if(K.a||K.arrowleft)mx-=1;if(K.d||K.arrowright)mx+=1;if(K.w||K.arrowup)my-=1;if(K.s||K.arrowdown)my+=1;
 const m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m;}p.dx=mx;p.dy=my;p.moving=m>.1;
 if(B.state==='fight'||B.state==='between'||B.state==='won'){
  let vx=mx*B.st.spd,vy=my*B.st.spd;
  if(p.dashT>0){p.dashT-=dt;vx=p.dashV[0]*720;vy=p.dashV[1]*720;if(Math.random()<.8)p.trail.push({x:p.x,y:p.y,life:.25});}
  if(Math.abs(mx)>.15)p.face=mx>0?1:-1;
  const nx=p.x+vx*dt,ny=p.y+vy*dt;if(walkable(nx,p.y,45))p.x=nx;if(walkable(p.x,ny,45))p.y=ny;collideDecos(p,p.r);
 }
 p.inv=Math.max(0,p.inv-dt);p.shieldT=Math.max(0,p.shieldT-dt);B.hurtFlash=Math.max(0,B.hurtFlash-dt);B.shake=Math.max(0,B.shake-dt*40);
 p.trail.forEach(t=>t.life-=dt);p.trail=p.trail.filter(t=>t.life>0);
 if(has('regen')&&B.state==='fight')p.hp=Math.min(p.maxhp,p.hp+3*dt);
 // ateş
 p.fireCd-=dt;
 if(B.firing&&p.fireCd<=0&&B.state==='fight'){p.fireCd=.26;const tg=nearest(p.x,p.y-30,560);let ang=tg?Math.atan2(tg.y-10-(p.y-40),tg.x-p.x):(p.face>0?0:Math.PI);if(tg)p.face=tg.x>p.x?1:-1;
  const angs=has('triple')?[ang-.17,ang,ang+.17]:[ang];angs.forEach(a=>B.pb.push({x:p.x+p.face*14,y:p.y-44,vx:Math.cos(a)*640,vy:Math.sin(a)*640,life:.85,rot:0}));SFX.shoot();}
 // oyuncu mermileri
 for(let i=B.pb.length-1;i>=0;i--){const b=B.pb[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;b.rot+=dt*14;let hit=false;
  for(const e of B.enemies){if(e.spawn>0)continue;if(Math.hypot(e.x-b.x,(e.y-12)-b.y)<e.r+12){damage(e,B.st.dmg);SFX.hit();e.vx+=b.vx*.04;e.vy+=b.vy*.04;hit=true;break;}}
  if(hit||b.life<=0)B.pb.splice(i,1);}
 // düşmanlar
 for(const e of B.enemies.slice()){
  e.t+=dt;e.hit=Math.max(0,e.hit-dt);if(e.spawn>0){e.spawn-=dt;continue;}
  const dx=p.x-e.x,dy=(p.y-20)-e.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;e.ang=Math.atan2(dy,dx);e.cd-=dt;
  let vx=0,vy=0;
  if(e.tp==='drone'){const want=230;const k=d>want+40?1:d<want-40?-1:0;vx=(ux*k+(-uy)*.7)*e.spd;vy=(uy*k+ux*.7)*e.spd;
   if(e.cd<=0&&d<620){e.cd=1.7+Math.random()*.6;shootE(e,Math.atan2(dy,dx),7*e.s*em,230);}}
  if(e.tp==='crab'){if(e.state==='move'){vx=ux*e.spd;vy=uy*e.spd;if(d<260&&e.cd<=0){e.state='wind';e.st=.45;}}
   else if(e.state==='wind'){e.st-=dt;if(e.st<=0){e.state='charge';e.st=.55;e.cv=[ux,uy];}}
   else if(e.state==='charge'){e.st-=dt;vx=e.cv[0]*400;vy=e.cv[1]*400;if(e.st<=0){e.state='move';e.cd=1.6;}}}
  if(e.tp==='turret'){if(e.cd<=0&&d<700){e.cd=2.6;[0,.15,.3].forEach(t=>setTimeout(()=>{if(B&&!e.dead)shootE(e,e.ang,8*e.s*em,250);},t*1000));}}
  if(e.tp==='boss'){const rage=e.hp<e.max*.5;
   if(e.state==='move'){vx=ux*e.spd*(d>200?1:-.3);vy=uy*e.spd*(d>200?1:-.3);
    if(e.cd<=0){e.cd=rage?1.7:2.4;const r=Math.random();const lvB=B.lvE||1;
     if(r<.35){const n=rage?18:14;e.phase+=.3;for(let k=0;k<n;k++)shootE(e,e.phase+k/n*6.28,9+lvB,190);if(rage)setTimeout(()=>{if(B&&!e.dead)for(let k=0;k<n;k++)shootE(e,e.phase+.17+k/n*6.28,9+lvB,170);},350);}
     else if(r<.65){for(let k=-2;k<=2;k++)shootE(e,e.ang+k*.16,10+lvB,280);}
     else if(r<.85){e.state='wind';e.st=.6;}
     else{for(let k=-4;k<=4;k++)setTimeout(()=>{if(B&&!e.dead)shootE(e,e.ang+k*.12,9+lvB,300);},(k+4)*70);}
     if(e.summon===0&&e.hp<e.max*.6){e.summon=1;spawnEnemy('drone',B.lvE);spawnEnemy('crab',B.lvE);}
     if(e.summon===1&&e.hp<e.max*.3){e.summon=2;spawnEnemy('drone',B.lvE);spawnEnemy('drone',B.lvE);spawnEnemy('crab',B.lvE);}}}
   else if(e.state==='wind'){e.st-=dt;if(e.st<=0){e.state='charge';e.st=.7;e.cv=[ux,uy];}}
   else if(e.state==='charge'){e.st-=dt;vx=e.cv[0]*460;vy=e.cv[1]*460;if(Math.random()<.5)B.parts.push({tp:'smoke',x:e.x,y:e.y+20,vx:0,vy:0,life:.4,max:.4,col:'#64748b',size:10});if(e.st<=0){e.state='move';e.cd=1.2;}}}
  e.vx*=.9;e.vy*=.9;const nx=e.x+(vx+e.vx)*dt,ny=e.y+(vy+e.vy)*dt;if(walkable(nx,e.y,60))e.x=nx;if(walkable(e.x,ny,60))e.y=ny;if(e.tp!=='drone')collideDecos(e,e.r);
  for(const o of B.enemies){if(o===e)continue;const ox=e.x-o.x,oy=e.y-o.y,om=Math.hypot(ox,oy),rr=e.r+o.r;if(om<rr&&om>0){e.x+=ox/om*(rr-om)*.5;e.y+=oy/om*(rr-om)*.5;}}
  if(d<e.r+p.r+6){const cdmg=(e.state==='charge'?(e.tp==='boss'?22:13):6)*e.s*em;hurt(e.tp==='boss'?cdmg/e.s*(1+(B.lvE-1)*.1):cdmg);}
 }
 // düşman mermileri
 for(let i=B.eb.length-1;i>=0;i--){const b=B.eb[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  if(Math.hypot(b.x-p.x,b.y-(p.y-34))<b.r+16){if(p.shieldT>0){B.parts.push({tp:'spark',x:b.x,y:b.y,vx:-b.vx*.3,vy:-b.vy*.3,life:.25,max:.25,col:'#67e8f9'});}else hurt(b.dmg);B.eb.splice(i,1);continue;}
  if(b.life<=0)B.eb.splice(i,1);}
 // altınlar
 for(let i=B.coins.length-1;i>=0;i--){const c=B.coins[i];c.t+=dt;const dx=p.x-c.x,dy=(p.y-30)-c.y,d=Math.hypot(dx,dy);
  if(c.t>.45&&(d<320||B.state==='won')){const sp=380+c.t*500;c.vx=dx/d*sp;c.vy=dy/d*sp;}else{c.vx*=.92;c.vy*=.92;}
  c.x+=c.vx*dt;c.y+=c.vy*dt;if(d<26){B.coinsGot+=c.v;B.coins.splice(i,1);if(Math.random()<.5)SFX.coin();}}
 // efektler
 B.fx.forEach(f=>{f.life-=dt;if(f.tp==='ring')f.r=f.R*(1-f.life/f.max);
  if(f.tp==='nova'){f.r=280*(1-f.life/f.max);f.x=p.x;f.y=p.y;B.enemies.forEach(e=>{if(!f.done.has(e)&&e.spawn<=0&&Math.hypot(e.x-p.x,e.y-p.y)<f.r+e.r){f.done.add(e);const a=Math.atan2(e.y-p.y,e.x-p.x);e.vx+=Math.cos(a)*500;e.vy+=Math.sin(a)*500;damage(e,B.st.dmg*6,true);}});
   B.eb=B.eb.filter(b=>Math.hypot(b.x-p.x,b.y-p.y)>f.r);}});
 B.fx=B.fx.filter(f=>f.life>0);
 B.parts.forEach(q=>{q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.92;q.vy*=.92;});B.parts=B.parts.filter(q=>q.life>0);
 B.texts.forEach(q=>{q.life-=dt;q.y-=40*dt;});B.texts=B.texts.filter(q=>q.life>0);
 if(B.state==='won'||B.state==='lost'){B.endT-=dt;if(B.endT<=0){endBattle(B.state==='won');return;}}
 hudUpdate();
}

 if(B.boss)set('bbI','width',Math.max(0,B.boss.hp/B.boss.max*100)+'%');
 POWERS.filter(x=>!x.passive).forEach(P=>{const cd=B.cd[P.id],k=P.cd?cd/P.cd:0;const el=document.getElementById('cd-'+P.id),tt=document.getElementById('ct-'+P.id);

function render(){
 const c=B.ctx,p=B.p,Z=B.Z,vw=B.W/Z,vh=B.H/Z;
 let cx=p.x-vw/2,cy=p.y-30-vh/2;cx=Math.max(-200,Math.min(WORLD-vw+200,cx));cy=Math.max(-200,Math.min(WORLD-vh+200,cy));

 c.fillStyle=B.T.sea;c.fillRect(cx,cy,vw,vh);
 {const sx=Math.max(0,Math.floor(cx)),sy=Math.max(0,Math.floor(cy)),sw=Math.min(WORLD-sx,Math.ceil(vw)+2),sh=Math.min(WORLD-sy,Math.ceil(vh)+2);if(sw>0&&sh>0)c.drawImage(B.off,sx,sy,sw,sh,sx,sy,sw,sh);}
 if(B.isl.th==='lava'||B.isl.th==='fortress'){B.decos.forEach(d=>{if(d.tp==='lava'){c.globalAlpha=.25+.15*Math.sin(B.t*3+d.x);c.fillStyle='#fb923c';c.beginPath();c.ellipse(d.x,d.y,48*d.s,34*d.s,d.rot,0,7);c.fill();c.globalAlpha=1;}});}
 // altınlar
 B.coins.forEach(k=>{c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(k.x,k.y+8,7,3,0,0,7);c.fill();const g=c.createRadialGradient(k.x-2,k.y-2,1,k.x,k.y,8);g.addColorStop(0,'#fff7c2');g.addColorStop(.4,'#fbbf24');g.addColorStop(1,'#b45309');c.fillStyle=g;c.beginPath();c.arc(k.x,k.y,7*(.8+.2*Math.abs(Math.sin(B.t*6+k.x))),0,7);c.fill();});
 // halkalar (yerde)
 B.fx.forEach(f=>{if(f.tp==='ring'){c.globalAlpha=f.life/f.max;c.strokeStyle=f.col;c.lineWidth=4;c.beginPath();c.ellipse(f.x,f.y,f.r,f.r*.6,0,0,7);c.stroke();c.globalAlpha=1;}
  if(f.tp==='nova'){c.globalAlpha=f.life/f.max*.8;const g=c.createRadialGradient(f.x,f.y,f.r*.6,f.x,f.y,f.r);g.addColorStop(0,'rgba(167,139,250,0)');g.addColorStop(.8,'rgba(196,181,253,.6)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.beginPath();c.ellipse(f.x,f.y-20,f.r,f.r*.75,0,0,7);c.fill();c.globalAlpha=1;}});
 // varlıklar (y sırasına göre)
 const ents=B.enemies.map(e=>({y:e.y,f:()=>drawEnemy(c,e)}));ents.push({y:p.y,f:()=>drawPlayer(c)});ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
 // oyuncu mermileri
 const sim=IMG[hero().shotImg];B.pb.forEach(b=>{c.save();c.translate(b.x,b.y);c.globalAlpha=.35;c.fillStyle=B.T.glow;c.beginPath();c.arc(-b.vx*.02,-b.vy*.02,8,0,7);c.fill();c.globalAlpha=1;c.rotate(b.rot);if(imOk(sim))c.drawImage(sim,-15,-8,30,16);c.restore();});
 // düşman mermileri
 c.globalCompositeOperation='lighter';
 B.eb.forEach(b=>{const g=c.createRadialGradient(b.x,b.y,1,b.x,b.y,b.r*1.9);g.addColorStop(0,'#fff');g.addColorStop(.35,b.col);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(b.x,b.y,b.r*1.9,0,7);c.fill();});
 B.parts.forEach(q=>{if(q.tp==='spark'){c.globalAlpha=q.life/q.max;c.strokeStyle=q.col;c.lineWidth=2.5;c.beginPath();c.moveTo(q.x,q.y);c.lineTo(q.x-q.vx*.03,q.y-q.vy*.03);c.stroke();}});
 B.fx.forEach(f=>{if(f.tp==='bolt'){c.globalAlpha=f.life/f.max;c.strokeStyle='#a5f3fc';c.lineWidth=4;c.beginPath();c.moveTo(f.a[0],f.a[1]);const n=7;for(let i=1;i<n;i++){const k=i/n;c.lineTo(f.a[0]+(f.b[0]-f.a[0])*k+(Math.random()-.5)*26,f.a[1]+(f.b[1]-f.a[1])*k+(Math.random()-.5)*26);}c.lineTo(f.b[0],f.b[1]);c.stroke();c.lineWidth=10;c.globalAlpha*=.3;c.stroke();}});
 c.globalAlpha=1;c.globalCompositeOperation='source-over';
 B.parts.forEach(q=>{const a=q.life/q.max;if(q.tp==='smoke'){c.globalAlpha=a*.5;c.fillStyle=q.col;c.beginPath();c.arc(q.x,q.y,q.size*(2-a),0,7);c.fill();}
  if(q.tp==='debris'){c.globalAlpha=a;c.fillStyle=q.col;c.fillRect(q.x-q.size/2,q.y-q.size/2,q.size,q.size);}});
 c.globalAlpha=1;
 c.textAlign='center';B.texts.forEach(q=>{c.globalAlpha=Math.min(1,q.life*2);c.font=`900 ${q.size}px "Exo 2",sans-serif`;c.lineWidth=4;c.strokeStyle='rgba(0,0,0,.7)';c.strokeText(q.txt,q.x,q.y);c.fillStyle=q.col;c.fillText(q.txt,q.x,q.y);});c.globalAlpha=1;
 // ekran katmanı
 c.setTransform(B.dpr,0,0,B.dpr,0,0);c.drawImage(B.vig,0,0);
 if(B.hurtFlash>0){c.fillStyle=`rgba(244,63,94,${B.hurtFlash*.6})`;c.fillRect(0,0,B.W,B.H);}
 if(p.hp<p.maxhp*.25&&B.state==='fight'){c.fillStyle=`rgba(190,18,60,${.12+.08*Math.sin(B.t*6)})`;c.fillRect(0,0,B.W,B.H);}
 // mini harita
 const m=B.mm,k=192/WORLD;m.clearRect(0,0,192,192);m.save();m.beginPath();m.arc(96,96,96,0,7);m.clip();m.fillStyle='rgba(7,17,31,.7)';m.fillRect(0,0,192,192);m.drawImage(B.mmBg,0,0);
 B.enemies.forEach(e=>{m.fillStyle=e.tp==='boss'?'#f43f5e':'#fb923c';m.beginPath();m.arc(e.x*k,e.y*k,e.tp==='boss'?9:4.5,0,7);m.fill();});
 m.fillStyle='#22d3ee';m.beginPath();m.arc(p.x*k,p.y*k,6,0,7);m.fill();m.strokeStyle='#fff';m.lineWidth=2;m.stroke();m.restore();
}
function shadow(c,x,y,rx,ry,a){c.fillStyle=`rgba(0,0,0,${a||.3})`;c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.fill();}
function drawPlayer(c){
 const p=B.p,h=hero(),im=IMG[h.img],H=86,W=H*h.ar,bob=p.moving?Math.sin(B.t*12)*2.5:Math.sin(B.t*2)*1;
 const flip=h.flip?p.face>0:p.face<0;
 p.trail.forEach(t=>{c.globalAlpha=t.life*1.6;c.save();c.translate(t.x,t.y);if(flip)c.scale(-1,1);if(imOk(im))c.drawImage(im,-W/2,-H+6,W,H);c.restore();});c.globalAlpha=1;
 shadow(c,p.x,p.y+2,22,8,.35);
 if(p.inv>0&&Math.floor(B.t*16)%2&&p.dashT<=0)c.globalAlpha=.45;
 c.save();c.translate(p.x,p.y+bob);if(flip)c.scale(-1,1);if(imOk(im))c.drawImage(im,-W/2,-H+6,W,H);c.restore();c.globalAlpha=1;
 if(player==='emir'){const ci=IMG.cat,px=p.x-p.face*42,py=p.y-6+Math.sin(B.t*4)*4;shadow(c,px,p.y+4,12,4,.25);if(imOk(ci))c.drawImage(ci,px-15,py-28,30,29);}
 if(p.shieldT>0){const a=.35+.15*Math.sin(B.t*10);c.strokeStyle=`rgba(103,232,249,${a+.3})`;c.fillStyle=`rgba(34,211,238,${a*.35})`;c.lineWidth=3;c.beginPath();c.ellipse(p.x,p.y-38,44,54,0,0,7);c.fill();c.stroke();}
 // nişan
 const tg=nearest(p.x,p.y-30,560);if(tg&&B.state==='fight'){c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=2;c.setLineDash([6,6]);c.beginPath();c.ellipse(tg.x,tg.y+tg.r*.6,tg.r+10,(tg.r+10)*.45,0,0,7);c.stroke();c.setLineDash([]);}
}
function drawEnemy(c,e){
 const T=B.T;if(e.spawn>0){c.globalAlpha=1-e.spawn/.7;}
 const hov=e.tp==='drone'?Math.sin(e.t*4)*3-12:0;
 if(e.tp==='drone'){shadow(c,e.x,e.y+16,15,5,.28);c.save();c.translate(e.x,e.y+hov);
  [-1,1].forEach(s=>{c.fillStyle='#1f2937';c.beginPath();c.arc(s*18,-2,6,0,7);c.fill();c.strokeStyle='rgba(203,213,225,.7)';c.lineWidth=2;c.beginPath();const a=e.t*30;c.moveTo(s*18+Math.cos(a)*9,-2+Math.sin(a)*3);c.lineTo(s*18-Math.cos(a)*9,-2-Math.sin(a)*3);c.stroke();});
  const g=c.createRadialGradient(-5,-6,2,0,0,17);g.addColorStop(0,'#64748b');g.addColorStop(1,'#111827');c.fillStyle=g;c.beginPath();c.arc(0,0,16,0,7);c.fill();c.strokeStyle=T.glow;c.lineWidth=2;c.stroke();
  const ex=Math.cos(e.ang)*5,ey=Math.sin(e.ang)*4;c.fillStyle='#ff3b3b';c.beginPath();c.arc(ex,ey,5,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(ex-1.5,ey-1.5,1.6,0,7);c.fill();c.restore();}
 if(e.tp==='crab'){shadow(c,e.x,e.y+12,24,8,.3);c.save();c.translate(e.x,e.y);const wind=e.state==='wind';
  c.strokeStyle='#334155';c.lineWidth=4;c.lineCap='round';for(let i=0;i<3;i++)[-1,1].forEach(s=>{const w=Math.sin(e.t*14+i)*4;c.beginPath();c.moveTo(s*12,-4+i*5);c.lineTo(s*28,2+i*6+w);c.lineTo(s*32,12+i*5+w);c.stroke();});
  const fx=Math.cos(e.ang),fy=Math.sin(e.ang);c.fillStyle='#475569';[-1,1].forEach(s=>{c.beginPath();c.arc(fx*22+(-fy)*s*14,fy*16+fx*s*10-6,8,0,7);c.fill();});
  const g=c.createLinearGradient(0,-20,0,12);g.addColorStop(0,'#94a3b8');g.addColorStop(1,'#1e293b');c.fillStyle=g;c.beginPath();c.ellipse(0,-6,22,16,0,0,7);c.fill();
  c.strokeStyle=wind&&Math.floor(e.t*20)%2?'#ff3b3b':T.glow;c.lineWidth=2.5;c.stroke();c.fillStyle='#ff3b3b';c.fillRect(-9+fx*4,-12+fy*3,18,4);c.restore();}
 if(e.tp==='turret'){shadow(c,e.x,e.y+10,24,9,.3);c.save();c.translate(e.x,e.y);c.fillStyle='#1f2937';c.beginPath();for(let i=0;i<8;i++){const a=i/8*6.28+.39;c.lineTo(Math.cos(a)*24,Math.sin(a)*18);}c.closePath();c.fill();c.strokeStyle='#475569';c.lineWidth=2;c.stroke();
  c.save();c.translate(0,-10);c.rotate(e.ang);c.fillStyle='#334155';c.fillRect(0,-5,30,10);c.fillStyle='#0f172a';c.fillRect(26,-6,6,12);c.restore();
  const glow=e.cd<.5?1:.5;const g=c.createRadialGradient(0,-10,1,0,-10,13);g.addColorStop(0,'#fff');g.addColorStop(.4,T.glow);g.addColorStop(1,'rgba(0,0,0,0)');c.globalAlpha*=glow;c.fillStyle=g;c.beginPath();c.arc(0,-10,13,0,7);c.fill();c.restore();}
 if(e.tp==='boss'){const rage=e.hp<e.max*.5;shadow(c,e.x,e.y+30,58,20,.35);c.save();c.translate(e.x,e.y-14);
  if(rage){c.globalAlpha=.25+.15*Math.sin(B.t*8);c.fillStyle='#e11d48';c.beginPath();c.arc(0,0,72,0,7);c.fill();c.globalAlpha=1;}
  c.save();c.rotate(B.t*.6);for(let i=0;i<8;i++){c.rotate(Math.PI/4);c.fillStyle=i%2?'#1e293b':'#334155';c.beginPath();c.arc(0,0,54,-.3,.3);c.arc(0,0,40,.3,-.3,true);c.closePath();c.fill();}c.restore();
  const g=c.createRadialGradient(-10,-12,4,0,0,40);g.addColorStop(0,'#94a3b8');g.addColorStop(1,'#0f172a');c.fillStyle=g;c.beginPath();c.arc(0,0,38,0,7);c.fill();c.strokeStyle=rage?'#fb7185':T.glow;c.lineWidth=3;c.stroke();
  c.save();c.rotate(e.ang);c.fillStyle='#111827';c.fillRect(20,-18,30,10);c.fillRect(20,8,30,10);c.restore();
  const pul=14+3*Math.sin(B.t*6);const cg=c.createRadialGradient(0,0,2,0,0,pul+8);cg.addColorStop(0,'#fff');cg.addColorStop(.35,rage?'#fb7185':T.glow);cg.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=cg;c.beginPath();c.arc(0,0,pul+8,0,7);c.fill();
  if(e.state==='wind'&&Math.floor(e.t*16)%2){c.strokeStyle='#ff3b3b';c.lineWidth=4;c.beginPath();c.arc(0,0,58,0,7);c.stroke();}
  c.restore();}
 if(e.hit>0){c.globalCompositeOperation='lighter';c.fillStyle='rgba(255,255,255,.6)';c.beginPath();c.arc(e.x,e.y-(e.tp==='boss'?14:6)+hov,e.r+2,0,7);c.fill();c.globalCompositeOperation='source-over';}
 c.globalAlpha=1;
 if(e.tp!=='boss'&&e.hp<e.max&&e.spawn<=0){const w=e.r*2.2;c.fillStyle='rgba(0,0,0,.6)';c.fillRect(e.x-w/2,e.y-e.r-26+hov,w,5);c.fillStyle='#f43f5e';c.fillRect(e.x-w/2,e.y-e.r-26+hov,w*Math.max(0,e.hp/e.max),5);}
}

// ---------- Duraklat & bitiş ----------
function pauseB(){if(!B||B.state==='end')return;B.paused=true;B.firing=false;
 const d=document.createElement('div');d.className='pausebox';d.id='pz';d.innerHTML=`<div class="glass" style="padding:22px;max-width:340px;width:100%;text-align:center"><h2>Duraklatıldı</h2>
 <p style="color:var(--mut);margin:6px 0 4px;font-size:14px">Joystick: sol tarafta parmağını sürükle · Saldırı: kırmızı buton</p>
 <button class="btn pri mt" onclick="resumeB()">Devam et</button><button class="btn gh mt" onclick="endBattle(false,true)">Savaştan çık</button></div>`;document.getElementById('bt').appendChild(d);}
function resumeB(){const d=document.getElementById('pz');if(d)d.remove();if(B){B.paused=false;B.last=performance.now();}}
function cleanupB(){if(!B)return;window.removeEventListener('keydown',B.kd);window.removeEventListener('keyup',B.ku);window.removeEventListener('resize',resize);document.removeEventListener('visibilitychange',B.vis);
 const d=document.getElementById('bt');if(d)d.remove();document.body.style.overflow='';hudC={};}
function endBattle(won,quit){
 if(!B||B.state==='end')return;const b=B;b.state='end';cleanupB();B=null;
 const s=S(),isl=b.isl;addCoins(b.coinsGot);
 let html='';
 if(b.arena){const rec=b.wave>s.ew;if(rec)s.ew=b.wave;if(b.wave>=10)badge('wave10');persist();
  if(rec)confetti();SFX[rec?'win':'lose']();
  html=`<h2>${rec?'Yeni rekor!':'Arena bitti'}</h2><p>${b.wave}. dalgaya ulaştın</p>
  <div class="kv"><div><small>Yok edilen bot</small><b>${b.kills}</b></div><div><small>Toplanan altın</small><b>${coinH(b.coinsGot)}</b></div><div><small>Kazanılan XP</small><b>${b.xpGot}</b></div><div><small>En iyi rekor</small><b>${s.ew}. dalga</b></div></div>
  <button class="btn pri mt" onclick="startQuiz('arena')">Tekrar dene</button>`;}
 else if(won){const pct=b.p.hp/b.p.maxhp,st=pct>=.7?3:pct>=.35?2:1,prev=s.stars[isl.id]||0,first=!prev;s.stars[isl.id]=Math.max(prev,st);
  const bonus=Math.round((80+isl.lv*30)*(first?1.5:1)),xpB=50+isl.lv*20;addCoins(bonus);gainXP(xpB);
  badge('first');if(st===3)badge('perfect');if(conquered()>=6)badge('half');if(isl.final)badge('final');if(totalStars(player)===MAXSTARS)badge('legend');persist();
  SFX.win();confetti();
  html=`<div style="font-size:15px;letter-spacing:3px;color:var(--am);font-weight:800">ADA FETHEDİLDİ</div><h2>${isl.name}</h2><div style="font-size:44px;letter-spacing:6px;margin:6px 0">${starsH(st)}</div>
  <div class="kv"><div><small>Yok edilen bot</small><b>${b.kills}</b></div><div><small>Toplanan altın</small><b>${coinH(b.coinsGot)}</b></div><div><small>Fetih ödülü${first?' (ilk sefer x1,5)':''}</small><b>${coinH(bonus)}</b></div><div><small>Kazanılan XP</small><b>${b.xpGot+xpB}</b></div></div>
  <p style="margin-top:10px">${st<3?'Daha az hasar alırsan 3 yıldız kazanırsın.':'Kusursuz fetih!'}</p>`;}
 else{persist();SFX.lose();html=`<h2>${quit?'Savaştan çekildin':'Yenildin'}</h2><p>${quit?'':'Bu sefer olmadı. Seviye atlayıp ya da Hangar\'dan geliştirme alıp tekrar dene!'}</p>
  <div class="kv"><div><small>Yok edilen bot</small><b>${b.kills}</b></div><div><small>Toplanan altın</small><b>${coinH(b.coinsGot)}</b></div></div>`;}
 app.innerHTML=`<div class="res glass" style="margin-top:20px">${html}<div class="perk" style="margin-top:14px"><span class="lvl">SV ${s.lvl}</span><div style="flex:1"><div class="xpb"><i style="width:${Math.min(100,s.xp/xpNeed(s.lvl)*100)}%"></i></div></div><small style="color:var(--mut)">${s.xp}/${xpNeed(s.lvl)} XP</small></div>
 ${!b.arena?`<button class="btn ${won?'gh':'pri'} mt" onclick="startQuiz('${isl.id}')">${won?'Tekrar oyna':'Tekrar dene'}</button>`:''}<button class="btn ${won&&!b.arena?'pri':'gh'} mt" onclick="worldMap()">Haritaya dön</button></div>`;
 window.scrollTo({top:0});
}

try{home();}catch(err){showErr(err);}
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
